name: Zapmail removal watch

# Why this exists instead of the Vercel cron:
# vercel.json declares `/api/health-snapshot` at `0 13 * * *`, but it has never
# actually fired — inbox_health_daily had only 9 of 16 days, none of them at
# 13:00, and the removal watcher's heartbeat never moved off a manual run. A
# missed day means a Zapmail deletion date passes with no alert, which is the
# one thing this system exists to prevent.
#
# Runs 4x/day so a single delayed/skipped run can't lose a date. The alert is
# idempotent (each mailbox is flagged `date_notified` once), so extra runs are
# free — they just re-confirm.

on:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 8 * * *'
    - cron: '0 14 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:

concurrency:
  group: zapmail-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # 15 was not enough: the full-campaign reply scan was cancelled mid-run,
    # which silently left rule 10's safety net stale.
    timeout-minutes: 60   # 30 + up to ~33 for the snapshot's worst case: 3 x (290s + 160s outcome check) + 2 x 300s
    steps:
      - name: Zapmail removal check (deletion-date alerts + removal confirmation)
        env:
          PW: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Running Zapmail removal check..."
          body=$(curl -sS --max-time 290 \
            "https://email-infra.vercel.app/api/zapmail-removals?action=check&commit=1&pw=${PW}")
          echo "$body"
          # A 200 with an {"error": ...} payload is still a failure — fail loudly
          # so GitHub notifies, rather than logging it and moving on.
          if echo "$body" | jq -e '.error' >/dev/null 2>&1; then
            echo "removal check failed: $(echo "$body" | jq -r '.error')" >&2
            exit 1
          fi
          echo "ok - scanned=$(echo "$body" | jq -r '.scanned // "?"')" \
               "removed=$(echo "$body" | jq -r '(.removed // []) | length')" \
               "due=$(echo "$body" | jq -r '(.due // []) | length')"

      # The invariants result is SERVED FROM STORAGE — /api/invariants returns
      # the last stored run. Nothing was refreshing it: vercel.json declares a
      # cron, and this whole workflow exists because that cron has never fired.
      # So a rule stayed FAILED on screen for a day after the thing it checks
      # was fixed — forwarding was corrected on 2026-09-18 and rule 4 still read
      # FAIL on the dashboard the next morning (Tim, 2026-09-19). A stale check
      # is worse than no check: it sends someone to fix what is already fixed.
      # ORDER MATTERS, and it is a dependency order, not a preference:
      #   sync             writes overview_v2 — the ONLY source of which client
      #                    an inbox belongs to (health_snapshot.attrs_from_overview)
      #   health snapshot  READS overview_v2, writes inbox_health_daily + health_fleet
      #   inboxes view     is BUILT FROM health_fleet, so it follows the snapshot
      #
      # The chain is sync -> snapshot -> inboxes, and every link is real. An
      # earlier attempt put the snapshot FIRST, on the theory that burn
      # detection should not be gated on the Overview; it failed immediately
      # with "no inboxes in overview", because attribution comes from exactly
      # that cache. The dependency is the constraint, not the priority.
      - name: Rebuild the Overview (sync)
        id: sync
        if: github.event.schedule == '0 2 * * *' || github.event_name == 'workflow_dispatch'
        # Loud but not blocking, and gated at the end. This step used to block,
        # on the reasoning that the snapshot reads the overview_v2 cache sync
        # writes. That is true only when the cache is EMPTY. On 2026-10-23 sync
        # timed out while overview_v2 was 10.5h old -- perfectly usable -- and
        # the snapshot was skipped anyway, so burn scoring was lost to a
        # freshness problem it did not have. The snapshot now checks the
        # overview itself (below) instead of inferring it from sync's exit code.
        continue-on-error: true
        env:
          PW: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          set -uo pipefail
          curl_rc=0
          body=$(curl -sS -X POST --max-time 290 \
            "https://email-infra.vercel.app/api/sync?pw=${PW}") || curl_rc=$?
          echo "${body:-<no body>}" | head -c 600; echo

          # curl gives up at 290s; Vercel keeps going to 300s. A timeout here
          # therefore says nothing about whether the sync SUCCEEDED -- it only
          # says we stopped listening. Judge it by the artefact, not the exit
          # code: if overview_v2 was written in the last 15 minutes, the sync
          # did its job and the disconnect is ours.
          if [ "${curl_rc:-0}" != "0" ]; then
            echo "curl exited ${curl_rc} — checking whether the sync landed anyway"
            sleep 30
            ov=$(curl -sS --max-time 60 \
              "https://email-infra.vercel.app/api/overview?pw=${PW}")
            age=$(echo "$ov" | jq -r '._age_hours // 999')
            acc=$(echo "$ov" | jq -r '.total_accounts // 0')
            if [ "$(echo "$age < 0.25" | bc -l 2>/dev/null || echo 0)" = "1" ] \
               && [ "$acc" != "0" ]; then
              echo "ok - sync completed server-side (${acc} accounts, ${age}h old)"
              exit 0
            fi
            echo "::error::sync timed out and overview_v2 was not refreshed (age=${age}h)"
            exit 1
          fi

          if echo "$body" | jq -e '.error' >/dev/null 2>&1; then
            echo "::error::sync failed: $(echo "$body" | jq -r '.error')"
            exit 1
          fi
          if [ "$(echo "$body" | jq -r '.ok // "false"')" != "true" ]; then
            echo "::error::sync did not report ok: $(echo "$body" | jq -r '.message // "?"')"
            exit 1
          fi
          echo "ok - $(echo "$body" | jq -r '.message')"

      # Three more _slow_cache entries nobody was warming. Each is a full
      # Zapmail or registrar walk, so the first person to open the tab was
      # paying 13-98s for it -- and past its TTL they were paying that AND
      # reading a stale number until the rebuild landed.
      - name: Daily health snapshot (restores the job the dead cron was meant to run)
        id: snapshot
        # EVERY run, not just 02:00. The snapshot is idempotent per date, so
        # four attempts a day cost nothing and mean one transient Smartlead
        # failure no longer loses the whole day's burn data — which is
        # exactly how the list went a week out of date.
        #
        # continue-on-error, but NOT forgiven: the job is failed at the end by
        # "Fail the job if the health snapshot failed". Without that split, a
        # failing snapshot SKIPPED the nine steps after it — the inboxes view,
        # the invariants refresh, acquisition, the reply scan and the warm-up
        # check all stopped running, including steps carrying their own
        # continue-on-error, because that flag covers a step's own failure and
        # not being skipped after an earlier one. Four days of that cost the
        # burn list, the rule results and the warm-up panel at once, from one
        # upstream Smartlead read returning HTTP 200 with an empty body.
        continue-on-error: true
        env:
          PW: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          set -uo pipefail
          # What the snapshot actually requires is a usable overview_v2, not a
          # successful sync. Check the artefact directly: scoring needs inboxes
          # to attribute, and a day-old attribution is fine, but an empty or
          # ancient one would silently produce a wrong fleet.
          ov=$(curl -sS --max-time 60 \
            "https://email-infra.vercel.app/api/overview?pw=${PW}") || ov='{}'
          ov_age=$(echo "$ov" | jq -r '._age_hours // 999')
          ov_acc=$(echo "$ov" | jq -r '.total_accounts // 0')
          if [ "$ov_acc" = "0" ]; then
            echo "::error::overview_v2 has no inboxes — burn scoring would be"
            echo "::error::built on an empty fleet. Fix the sync first."
            exit 1
          fi
          if [ "$(echo "$ov_age > 36" | bc -l 2>/dev/null || echo 0)" = "1" ]; then
            echo "::error::overview_v2 is ${ov_age}h old — too stale to attribute"
            echo "::error::burn to the right clients. Fix the sync first."
            exit 1
          fi
          echo "overview_v2 ok: ${ov_acc} accounts, ${ov_age}h old"

          # Smartlead sometimes hands our login a BLANK session for half an hour
          # or so (every read empty, auth/me empty; 2026-09-24, 2026-10-22) and
          # then recovers by itself. One failed attempt per run turned that into
          # a lost day, so try three times, five minutes apart. Each attempt is
          # a fresh request, so Vercel mints a fresh login each time.
          #
          # A curl timeout is NOT a failure by itself: curl gives up at 290s and
          # Vercel keeps going to 300s, and the route does more work after the
          # snapshot. So on a timeout, read the outcome the snapshot recorded.
          for attempt in 1 2 3; do
            started=$(date -u +%Y-%m-%dT%H:%M:%S)
            body=$(curl -sS --max-time 290 \
              "https://email-infra.vercel.app/api/health-snapshot?pw=${PW}") || {
              echo "attempt ${attempt}: curl gave up — reading the recorded outcome"
              body='{"error":"snapshot did not record an outcome after the timeout"}'
              for _ in 1 2 3 4 5 6 7 8; do
                sleep 20
                st=$(curl -sS --max-time 30 \
                  "https://email-infra.vercel.app/api/health-snapshot-status?pw=${PW}") || continue
                at=$(echo "$st" | jq -r '.at // ""' | cut -c1-19)
                if [[ "$at" > "$started" || "$at" == "$started" ]]; then
                  if [ "$(echo "$st" | jq -r '.ok')" = "true" ]; then
                    body='{"ok":true,"via":"recorded outcome after curl timeout"}'
                  else
                    body=$(echo "$st" | jq -c '{error: (.detail // "snapshot failed")}')
                  fi
                  break
                fi
              done
            }
            echo "attempt ${attempt}: $(echo "$body" | head -c 2000)"
            if ! echo "$body" | jq -e '.error' >/dev/null 2>&1; then break; fi
            if [ "$attempt" -lt 3 ]; then sleep 300; fi
          done
          # This step used to pipe straight to head, so a 200 carrying
          # {"error": "metrics fetch failed ... 401 unauthorized"} was a green
          # tick. The health history stopped being written on 2026-09-17 and
          # every run after it reported success — five days of silence while
          # burn rate, capacity and every health score ran on stale data.
          # A run that did not write history is a FAILURE now, and so is one
          # that skipped a weekday.
          if echo "$body" | jq -e '.error' >/dev/null 2>&1; then
            echo "::error::health snapshot failed: $(echo "$body" | jq -r '.error')"
            exit 1
          fi
          gaps=$(echo "$body" | jq -r '(.weekday_gaps // []) | join(", ")')
          if [ -n "$gaps" ]; then
            echo "::error::no Smartlead data for weekday(s): $gaps — history has a hole"
            exit 1
          fi
          echo "ok - daily rows written: $(echo "$body" | jq -r '.daily_rows_written // "?"')"

      - name: Warm the inboxes view
        # Follows the snapshot on every run for the same reason.
        continue-on-error: true
        env:
          PW: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          set -uo pipefail
          curl -sS --max-time 290 \
            "https://email-infra.vercel.app/api/inboxes?refresh=1&pw=${PW}" \
            | jq -r '"inboxes cached: \(.summary.inboxes // "?") inboxes, \(.domain_view.summary.domains // 0) burned domains"'

      # Rule 10's fix button deletes Smartlead accounts. It must not delete one
      # that still owns a positive reply — and a reply can sit on a PAUSED or
      # COMPLETED campaign just as easily as a live one, so answering that
      # honestly means reading every campaign. That is minutes, not the ~120s a
      # button gets. So the walk happens here and the button reads the result.
      # NOT continue-on-error: if this stops running, the button stops deleting
      # (by design), and a silently-red-for-weeks step is how that gets missed.
      - name: Refresh the invariants (the full run, campaigns included)
        if: github.event.schedule == '0 2 * * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          PW: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          set -uo pipefail
          body=$(curl -sS --max-time 290 \
            "https://email-infra.vercel.app/api/invariants?refresh=1&pw=${PW}")
          echo "$body" | head -c 1200
          fails=$(echo "$body" | jq -r '.counts.FAIL // "?"')
          echo "rules failing: $fails"

      # Acquisition numbers come from a live Smartlead walk cached for a day.
      # Warming it here means the first person to open the tab is not the one
      # who pays the 60-90s rebuild.
      - name: Refresh acquisition capacity from Smartlead
        # EVERY run, not just 02:00 — same reasoning as the health snapshot.
        # The Acquisition tab reports what each inbox is doing TODAY, and it
        # was rebuilt once a day, so the figure on screen was routinely a day
        # behind and a single failed run left it two.
        continue-on-error: true
        env:
          PW: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          set -uo pipefail
          curl -sS --max-time 290 \
            "https://email-infra.vercel.app/api/acquisition?refresh=1&pw=${PW}" \
            | jq -r '.summary | "inboxes=\(.inboxes) in_use=\(.in_use)/\(.usable) free=\(.free_inboxes) burned=\(.burned)"'

      # Warm the client-card detail so the first person to open a card is not
      # the one who pays for the ~45s build behind it.
      - name: Warm the client detail cache
        if: github.event.schedule == '0 2 * * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          PW: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          set -uo pipefail
          curl -sS --max-time 290 \
            "https://email-infra.vercel.app/api/client-detail?refresh=1&pw=${PW}" \
            | jq -r '"client details cached for \(.clients | length) clients"'

      # NOT continue-on-error. This step writes the health history that burn
      # rate, capacity and every health score read from; a run that fails to
      # write it must turn the workflow red, or the outage is invisible again.
      # Warm the Inboxes tab too. Its burned-domain view is a ~10s build on top
      # of five other reads; whoever opens the tab first should not pay for it.
      - name: Full-campaign positive-reply scan (rule 10's safety net)
        id: replyscan
        if: github.event.schedule == '0 2 * * *' || github.event_name == 'workflow_dispatch'
        # Loud but not blocking — gated at the end, same as the snapshot.
        continue-on-error: true
        env:
          PW: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          set -uo pipefail
          # The walk is ~496 campaigns and runs past curl's 290s cap while
          # Vercel continues to 300s. On 2026-10-23 it finished at 18:10:54
          # and curl had given up at 18:10:49 -- five seconds earlier -- and
          # this step failed the job over a scan that had just succeeded.
          # So a timeout is not a verdict: read what the scan recorded.
          started=$(date -u +%Y-%m-%dT%H:%M:%S)
          curl_rc=0
          body=$(curl -sS --max-time 290 \
            "https://email-infra.vercel.app/api/rule10-reply-scan?pw=${PW}") || curl_rc=$?
          echo "${body:-<no body>}" | head -c 1200; echo
          if [ "${curl_rc:-0}" != "0" ]; then
            echo "curl exited ${curl_rc} — reading what the scan recorded"
            for _ in 1 2 3 4 5 6; do
              sleep 20
              st=$(curl -sS --max-time 30 \
                "https://email-infra.vercel.app/api/rule10-safety-status?pw=${PW}") || continue
              at=$(echo "$st" | jq -r '.ts // ""' | cut -c1-19)
              if [[ -n "$at" && ( "$at" > "$started" || "$at" == "$started" ) ]]; then
                echo "ok - scan completed server-side at ${at}:" \
                     "campaigns=$(echo "$st" | jq -r '.campaigns_scanned')" \
                     "holding replies=$(echo "$st" | jq -r '.positives')"
                exit 0
              fi
            done
            echo "::error::reply scan timed out and recorded nothing newer than ${started}"
            exit 1
          fi
          if echo "$body" | jq -e '.error' >/dev/null 2>&1; then
            echo "::error::reply scan failed: $(echo "$body" | jq -r '.error')"
            exit 1
          fi
          echo "ok - candidates=$(echo "$body" | jq -r '(.candidates // []) | length')" \
               "campaigns=$(echo "$body" | jq -r '.campaigns_scanned // "?"')" \
               "holding replies=$(echo "$body" | jq -r '(.positives // []) | length')"

      # The Overview tab reads overview_v2, which ONLY /api/sync writes -- and
      # nothing was calling it. It sat 4 days old holding zero inboxes. A stale
      # sync there does not read as an error: it reads as a SMALLER FLEET, so
      # every count on the landing page is quietly low. This is the one cache
      # whose staleness is invisible by construction, so it runs first and it
      # is NOT continue-on-error.
      # Nothing warmed the Onboarding tab, so its three caches
      # (infra_lifecycle, zm_inventory, smartlead_tags) expired after 6h and
      # the next person to open it paid ~100s of rebuilds — past the browser's
      # 120s budget. That is the whole reason the tab "does not work".
      - name: Warm the onboarding view
        if: github.event.schedule == '0 2 * * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          PW: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          set -uo pipefail
          code=$(curl -sS -o /tmp/onb.json -w '%{http_code}' --max-time 290 \
            "https://email-infra.vercel.app/api/onboarding?refresh=1&pw=${PW}") || code=000
          echo "onboarding -> HTTP $code $(head -c 160 /tmp/onb.json 2>/dev/null)"

      # Rule 12, daily, posting to #infra-renewals. NOT continue-on-error:
      # the whole point is that a cold inbox is invisible, so a silently failing
      # check restores exactly the blind spot it was built to remove.
      - name: Warm-up check (every inbox sending or warming)
        id: warmupcheck
        if: github.event.schedule == '0 2 * * *' || github.event_name == 'workflow_dispatch'
        # Loud but not blocking — gated at the end, same as the snapshot.
        continue-on-error: true
        env:
          PW: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          set -uo pipefail
          body=$(curl -sS --max-time 290 \
            "https://email-infra.vercel.app/api/warmup-alert?pw=${PW}")
          echo "$body" | head -c 400; echo
          if echo "$body" | jq -e '.error' >/dev/null 2>&1; then
            echo "::error::warm-up check failed: $(echo "$body" | jq -r '.error')"
            exit 1
          fi
          echo "ok - status=$(echo "$body" | jq -r '.status // "?"')" \
               "cold=$(echo "$body" | jq -r '.cold // 0')" \
               "posted=$(echo "$body" | jq -r '.posted // false')"

      - name: Warm the remaining slow caches
        if: github.event.schedule == '0 2 * * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          PW: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          set -uo pipefail
          for path in domain-expiry generic-capacity acq-capacity; do
            code=$(curl -sS -o /tmp/$path.json -w '%{http_code}' --max-time 290 \
              "https://email-infra.vercel.app/api/$path?refresh=1&pw=${PW}") || code=000
            echo "$path -> HTTP $code $(head -c 140 /tmp/$path.json 2>/dev/null)"
          done

      # The gate for the step above. It runs LAST so that a failed snapshot
      # still shows up as a red run and still pages whoever is watching, while
      # no longer taking the rest of the job down with it. Anything that must
      # genuinely block later steps belongs before this, not after.
      - name: Fail the job if a must-not-fail step failed
        if: always() && (steps.sync.outcome == 'failure'
          || steps.snapshot.outcome == 'failure'
          || steps.replyscan.outcome == 'failure'
          || steps.warmupcheck.outcome == 'failure')
        run: |
          set -uo pipefail
          if [ "${{ steps.sync.outcome }}" = "failure" ]; then
            echo "::error::the Overview sync failed — attribution is running on"
            echo "::error::an older overview_v2. The snapshot still ran if that"
            echo "::error::cache was usable; if it was not, see its own error."
          fi
          if [ "${{ steps.snapshot.outcome }}" = "failure" ]; then
            echo "::error::the daily health snapshot failed — burn scoring did not run,"
            echo "::error::so the burned-inbox list is FROZEN at its last good date."
          fi
          if [ "${{ steps.replyscan.outcome }}" = "failure" ]; then
            echo "::error::the full-campaign positive-reply scan failed — rule 10's"
            echo "::error::safety net is stale, so the remove-from-Smartlead button"
            echo "::error::will refuse rather than risk cutting a live thread."
          fi
          if [ "${{ steps.warmupcheck.outcome }}" = "failure" ]; then
            echo "::error::the warm-up check failed — rule 12 did not report, so an"
            echo "::error::inbox could be sitting cold with nothing saying so."
          fi
          echo "::error::Every other step in this job still ran."
          exit 1
