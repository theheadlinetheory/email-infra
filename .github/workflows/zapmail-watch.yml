name: Zapmail removal watch

# Why this exists instead of the Vercel cron:
# vercel.json declares `/api/health-snapshot` at `0 13 * * *`, but it has never
# actually fired — inbox_health_daily had only 9 of 16 days, none of them at
# 13:00, and the removal watcher's heartbeat never moved off a manual run. A
# missed day means a Zapmail deletion date passes with no alert, which is the
# one thing this system exists to prevent.
#
# Runs 4x/day so a single delayed/skipped run can't lose a date. The alert is
# idempotent (each mailbox is flagged `date_notified` once), so extra runs are
# free — they just re-confirm.

on:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 8 * * *'
    - cron: '0 14 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:

concurrency:
  group: zapmail-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Zapmail removal check (deletion-date alerts + removal confirmation)
        env:
          PW: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Running Zapmail removal check..."
          body=$(curl -sS --max-time 290 \
            "https://email-infra.vercel.app/api/zapmail-removals?action=check&commit=1&pw=${PW}")
          echo "$body"
          # A 200 with an {"error": ...} payload is still a failure — fail loudly
          # so GitHub notifies, rather than logging it and moving on.
          if echo "$body" | jq -e '.error' >/dev/null 2>&1; then
            echo "removal check failed: $(echo "$body" | jq -r '.error')" >&2
            exit 1
          fi
          echo "ok - scanned=$(echo "$body" | jq -r '.scanned // "?"')" \
               "removed=$(echo "$body" | jq -r '(.removed // []) | length')" \
               "due=$(echo "$body" | jq -r '(.due // []) | length')"

      # The invariants result is SERVED FROM STORAGE — /api/invariants returns
      # the last stored run. Nothing was refreshing it: vercel.json declares a
      # cron, and this whole workflow exists because that cron has never fired.
      # So a rule stayed FAILED on screen for a day after the thing it checks
      # was fixed — forwarding was corrected on 2026-09-18 and rule 4 still read
      # FAIL on the dashboard the next morning (Tim, 2026-09-19). A stale check
      # is worse than no check: it sends someone to fix what is already fixed.
      # ORDER MATTERS, and it is a dependency order, not a preference:
      #   sync             writes overview_v2 — the ONLY source of which client
      #                    an inbox belongs to (health_snapshot.attrs_from_overview)
      #   health snapshot  READS overview_v2, writes inbox_health_daily + health_fleet
      #   inboxes view     is BUILT FROM health_fleet, so it follows the snapshot
      #
      # The chain is sync -> snapshot -> inboxes, and every link is real. An
      # earlier attempt put the snapshot FIRST, on the theory that burn
      # detection should not be gated on the Overview; it failed immediately
      # with "no inboxes in overview", because attribution comes from exactly
      # that cache. The dependency is the constraint, not the priority.
      - name: Rebuild the Overview (sync)
        if: github.event.schedule == '0 2 * * *' || github.event_name == 'workflow_dispatch'
        env:
          PW: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          set -uo pipefail
          body=$(curl -sS -X POST --max-time 290 \
            "https://email-infra.vercel.app/api/sync?pw=${PW}")
          echo "$body" | head -c 600; echo
          if echo "$body" | jq -e '.error' >/dev/null 2>&1; then
            echo "::error::sync failed: $(echo "$body" | jq -r '.error')"
            exit 1
          fi
          if [ "$(echo "$body" | jq -r '.ok // "false"')" != "true" ]; then
            echo "::error::sync did not report ok: $(echo "$body" | jq -r '.message // "?"')"
            exit 1
          fi
          echo "ok - $(echo "$body" | jq -r '.message')"

      # Three more _slow_cache entries nobody was warming. Each is a full
      # Zapmail or registrar walk, so the first person to open the tab was
      # paying 13-98s for it -- and past its TTL they were paying that AND
      # reading a stale number until the rebuild landed.
      - name: Daily health snapshot (restores the job the dead cron was meant to run)
        if: github.event.schedule == '0 2 * * *' || github.event_name == 'workflow_dispatch'
        env:
          PW: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          set -uo pipefail
          body=$(curl -sS --max-time 290 \
            "https://email-infra.vercel.app/api/health-snapshot?pw=${PW}")
          echo "$body" | head -c 2000; echo
          # This step used to pipe straight to head, so a 200 carrying
          # {"error": "metrics fetch failed ... 401 unauthorized"} was a green
          # tick. The health history stopped being written on 2026-09-17 and
          # every run after it reported success — five days of silence while
          # burn rate, capacity and every health score ran on stale data.
          # A run that did not write history is a FAILURE now, and so is one
          # that skipped a weekday.
          if echo "$body" | jq -e '.error' >/dev/null 2>&1; then
            echo "::error::health snapshot failed: $(echo "$body" | jq -r '.error')"
            exit 1
          fi
          gaps=$(echo "$body" | jq -r '(.weekday_gaps // []) | join(", ")')
          if [ -n "$gaps" ]; then
            echo "::error::no Smartlead data for weekday(s): $gaps — history has a hole"
            exit 1
          fi
          echo "ok - daily rows written: $(echo "$body" | jq -r '.daily_rows_written // "?"')"

      - name: Warm the inboxes view
        if: github.event.schedule == '0 2 * * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          PW: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          set -uo pipefail
          curl -sS --max-time 290 \
            "https://email-infra.vercel.app/api/inboxes?refresh=1&pw=${PW}" \
            | jq -r '"inboxes cached: \(.summary.inboxes // "?") inboxes, \(.domain_view.summary.domains // 0) burned domains"'

      # Rule 10's fix button deletes Smartlead accounts. It must not delete one
      # that still owns a positive reply — and a reply can sit on a PAUSED or
      # COMPLETED campaign just as easily as a live one, so answering that
      # honestly means reading every campaign. That is minutes, not the ~120s a
      # button gets. So the walk happens here and the button reads the result.
      # NOT continue-on-error: if this stops running, the button stops deleting
      # (by design), and a silently-red-for-weeks step is how that gets missed.
      - name: Refresh the invariants (the full run, campaigns included)
        if: github.event.schedule == '0 2 * * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          PW: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          set -uo pipefail
          body=$(curl -sS --max-time 290 \
            "https://email-infra.vercel.app/api/invariants?refresh=1&pw=${PW}")
          echo "$body" | head -c 1200
          fails=$(echo "$body" | jq -r '.counts.FAIL // "?"')
          echo "rules failing: $fails"

      # Acquisition numbers come from a live Smartlead walk cached for a day.
      # Warming it here means the first person to open the tab is not the one
      # who pays the 60-90s rebuild.
      - name: Refresh acquisition capacity from Smartlead
        if: github.event.schedule == '0 2 * * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          PW: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          set -uo pipefail
          curl -sS --max-time 290 \
            "https://email-infra.vercel.app/api/acquisition?refresh=1&pw=${PW}" \
            | jq -r '.summary | "inboxes=\(.inboxes) in_use=\(.in_use)/\(.usable) free=\(.free_inboxes) burned=\(.burned)"'

      # Warm the client-card detail so the first person to open a card is not
      # the one who pays for the ~45s build behind it.
      - name: Warm the client detail cache
        if: github.event.schedule == '0 2 * * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          PW: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          set -uo pipefail
          curl -sS --max-time 290 \
            "https://email-infra.vercel.app/api/client-detail?refresh=1&pw=${PW}" \
            | jq -r '"client details cached for \(.clients | length) clients"'

      # NOT continue-on-error. This step writes the health history that burn
      # rate, capacity and every health score read from; a run that fails to
      # write it must turn the workflow red, or the outage is invisible again.
      # Warm the Inboxes tab too. Its burned-domain view is a ~10s build on top
      # of five other reads; whoever opens the tab first should not pay for it.
      - name: Full-campaign positive-reply scan (rule 10's safety net)
        if: github.event.schedule == '0 2 * * *' || github.event_name == 'workflow_dispatch'
        env:
          PW: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          set -uo pipefail
          body=$(curl -sS --max-time 290 \
            "https://email-infra.vercel.app/api/rule10-reply-scan?pw=${PW}")
          echo "$body" | head -c 1200; echo
          if echo "$body" | jq -e '.error' >/dev/null 2>&1; then
            echo "::error::reply scan failed: $(echo "$body" | jq -r '.error')"
            exit 1
          fi
          echo "ok - candidates=$(echo "$body" | jq -r '(.candidates // []) | length')" \
               "campaigns=$(echo "$body" | jq -r '.campaigns_scanned // "?"')" \
               "holding replies=$(echo "$body" | jq -r '(.positives // []) | length')"

      # The Overview tab reads overview_v2, which ONLY /api/sync writes -- and
      # nothing was calling it. It sat 4 days old holding zero inboxes. A stale
      # sync there does not read as an error: it reads as a SMALLER FLEET, so
      # every count on the landing page is quietly low. This is the one cache
      # whose staleness is invisible by construction, so it runs first and it
      # is NOT continue-on-error.
      - name: Warm the remaining slow caches
        if: github.event.schedule == '0 2 * * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          PW: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          set -uo pipefail
          for path in domain-expiry generic-capacity acq-capacity; do
            code=$(curl -sS -o /tmp/$path.json -w '%{http_code}' --max-time 290 \
              "https://email-infra.vercel.app/api/$path?refresh=1&pw=${PW}") || code=000
            echo "$path -> HTTP $code $(head -c 140 /tmp/$path.json 2>/dev/null)"
          done
