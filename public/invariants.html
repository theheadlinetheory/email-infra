<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fleet rules</title>
<style>
  :root{
    --bg:#0f1216; --card:#171b21; --line:#242b34; --ink:#e8ecf1; --dim:#8b97a6;
    --pass:#3fb950; --fail:#f85149; --skip:#d29922; --accent:#58a6ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;padding:28px 20px 60px}
  .wrap{max-width:980px;margin:0 auto}
  h1{font-size:19px;margin:0 0 4px;letter-spacing:-.01em}
  .sub{color:var(--dim);font-size:12.5px;margin-bottom:18px}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
  .pill{border:1px solid var(--line);border-radius:20px;padding:3px 11px;font-size:12px;color:var(--dim)}
  .pill b{color:var(--ink)}
  button{background:var(--card);color:var(--ink);border:1px solid var(--line);
         border-radius:6px;padding:6px 13px;font:inherit;font-size:12.5px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button[disabled]{opacity:.5;cursor:default}
  .warn{background:#2b2209;border:1px solid #6b5412;border-radius:6px;
        padding:9px 13px;margin-bottom:16px;font-size:12.5px;color:#f0d68a}
  .rule{background:var(--card);border:1px solid var(--line);border-radius:8px;
        padding:12px 14px;margin-bottom:9px}
  .rh{display:flex;gap:11px;align-items:baseline}
  .n{color:var(--dim);font-size:12px;min-width:52px}
  .st{font-weight:700;min-width:44px}
  .PASS .st{color:var(--pass)} .FAIL .st{color:var(--fail)} .SKIP .st{color:var(--skip)}
  .nm{flex:1}
  .dt{color:var(--dim);font-size:12px}
  ul{margin:9px 0 0 66px;padding:0;list-style:none}
  li{color:#f0a9a4;font-size:12.5px;padding:1px 0;word-break:break-word}
  li.more{color:var(--dim)}
  .empty{color:var(--dim);padding:26px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>Fleet rules</h1>
  <div class="sub">The ten invariants from docs/INFRA_RULES.md. PASS · FAIL · SKIP — a rule that cannot see its input skips rather than passing.</div>
  <div class="bar">
    <span class="pill" id="counts">loading…</span>
    <span class="pill" id="age"></span>
    <span class="pill" id="scan"></span>
    <button id="refresh">Re-run now</button>
  </div>
  <div id="warn"></div>
  <div id="out" class="empty">loading…</div>
</div>
<script>
// ── auth ────────────────────────────────────────────────────────────────
// The password lives in a cookie, set once, exactly like the existing
// dashboard. A ?pw= in the URL is accepted, immediately stored, and then
// STRIPPED from the address bar — a password in a URL survives in browser
// history, in screenshots, and in any link that gets forwarded.
function cookie(name){
  const m = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
  return m ? m[2] : '';
}
function setPw(v){
  document.cookie = 'dashboard_pw=' + encodeURIComponent(v) + ';path=/;max-age=31536000;samesite=lax';
}
(function absorbUrlPw(){
  const u = new URL(location.href);
  const p = u.searchParams.get('pw');
  if (p) {
    setPw(p);
    u.searchParams.delete('pw');
    history.replaceState(null, '', u.pathname + (u.search || '') + u.hash);
  }
})();
async function api(path){
  const r = await fetch(path, {credentials: 'same-origin'});
  if (r.status === 401) {
    const p = prompt('Dashboard password:');
    if (p) { setPw(p); location.reload(); }
    return {error: 'not signed in'};
  }
  const j = await r.json().catch(() => ({error: 'bad JSON from ' + path}));
  return r.ok ? j : {error: j.error || ('HTTP ' + r.status)};
}
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function ago(s){
  if (s == null) return 'age unknown';
  if (s < 90) return s + 's ago';
  if (s < 5400) return Math.round(s/60) + 'm ago';
  return (s/3600).toFixed(1) + 'h ago';
}

function render(d){
  const c = d.counts || {};
  document.getElementById('counts').innerHTML =
    `<b>${c.PASS||0}</b> pass · <b>${c.FAIL||0}</b> fail · <b>${c.SKIP||0}</b> skip`;
  document.getElementById('age').innerHTML = 'as of <b>' + ago(d.age_seconds) + '</b>';
  document.getElementById('scan').innerHTML = d.scanned_campaigns === false
    ? 'campaign scan <b>skipped</b>' : 'campaigns <b>' + (d.active_campaigns ?? '?') + ' active</b>';

  let w = '';
  if (d.stale) w += '<div class="warn">This result is over a day old — the daily cron may not have run.</div>';
  if (d.active_campaigns === 0) w += '<div class="warn">0 ACTIVE campaigns. Anything keyed on campaign membership was skipped, not passed.</div>';
  (d.sources_unavailable || []).forEach(s =>
    w += `<div class="warn">Source unavailable: ${esc(s)} — rules needing it skipped.</div>`);
  document.getElementById('warn').innerHTML = w;

  const out = document.getElementById('out');
  out.className = '';
  out.innerHTML = (d.results || []).map(r => `
    <div class="rule ${r.status}">
      <div class="rh">
        <span class="n">RULE ${r.rule}</span>
        <span class="st">${r.status}</span>
        <span class="nm">${esc(r.name)}</span>
        <span class="dt">${esc(r.detail || '')}</span>
      </div>
      ${(r.violations||[]).length ? '<ul>' + r.violations.map(v => `<li>${esc(v)}</li>`).join('')
        + (r.violation_count > r.violations.length
           ? `<li class="more">…and ${r.violation_count - r.violations.length} more</li>` : '')
        + '</ul>' : ''}
    </div>`).join('');
}

async function load(refresh){
  const btn = document.getElementById('refresh');
  btn.disabled = true;
  if (refresh) btn.textContent = 'Running… ~80s';
  try {
    const d = await api('/api/invariants' + (refresh ? '?refresh=1' : ''));
    if (d.error) {
      document.getElementById('out').textContent = d.error;
      document.getElementById('out').className = 'empty';
    } else render(d);
  } catch (e) {
    document.getElementById('out').textContent = 'Failed: ' + e.message;
  }
  btn.disabled = false; btn.textContent = 'Re-run now';
}
document.getElementById('refresh').onclick = () => load(true);
load(false);
</script>
</body>
</html>
