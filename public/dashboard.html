<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sending infrastructure</title>
<style>
  :root{
    --bg:#0e1116; --card:#161b22; --line:#232a33; --line2:#2f3945;
    --ink:#e6edf3; --dim:#8b949e; --dim2:#6e7781;
    --ok:#3fb950; --bad:#f85149; --warn:#d29922; --accent:#58a6ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:13.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
       padding:0 0 60px}
  .top{border-bottom:1px solid var(--line);padding:16px 22px 0;position:sticky;top:0;
       background:var(--bg);z-index:5}
  .ttl{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}
  h1{font-size:16px;margin:0;letter-spacing:-.01em}
  .meta{color:var(--dim);font-size:11.5px}
  nav{display:flex;gap:2px}
  nav button{background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);
             font:inherit;font-size:12.5px;padding:7px 14px;cursor:pointer}
  nav button:hover{color:var(--ink)}
  nav button.on{color:var(--ink);border-bottom-color:var(--accent)}
  main{padding:20px 22px;max-width:1180px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px}
  .c{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
  .c .k{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  .c .v{font-size:22px;margin-top:5px;font-variant-numeric:tabular-nums}
  .c.bad .v{color:var(--bad)} .c.ok .v{color:var(--ok)} .c.warn .v{color:var(--warn)}
  h2{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;
     margin:22px 0 9px;font-weight:600}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  th{text-align:left;color:var(--dim);font-weight:500;padding:6px 10px;
     border-bottom:1px solid var(--line2);white-space:nowrap}
  td{padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
  tr:hover td{background:#1a212b}
  .tag{font-size:10.5px;padding:1px 6px;border-radius:10px;border:1px solid var(--line2);color:var(--dim)}
  .good{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)} .dim{color:var(--dim)}
  .rule{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)}
  .rule .st{min-width:42px;font-weight:700}
  .rule .nm{flex:1}
  .rule .dt{color:var(--dim);font-size:11.5px}
  .viol{margin:4px 0 8px 52px;color:#f0a9a4;font-size:11.5px}
  .viol div{padding:1px 0}
  .banner{background:#2b2209;border:1px solid #6b5412;color:#f0d68a;border-radius:7px;
          padding:9px 13px;margin-bottom:14px;font-size:12px}
  .empty{color:var(--dim);padding:24px 0}
  button.act{background:var(--card);color:var(--ink);border:1px solid var(--line2);
             border-radius:6px;padding:5px 12px;font:inherit;font-size:12px;cursor:pointer}
  button.act:hover{border-color:var(--accent)}
  .wrap{overflow-x:auto}
</style>
</head>
<body>
<div class="top">
  <div class="ttl">
    <h1>Sending infrastructure</h1>
    <span class="meta" id="meta">loading…</span>
    <span style="flex:1"></span>
    <button class="act" id="reload">Reload</button>
  </div>
  <nav>
    <button data-t="overview" class="on">Overview</button>
    <button data-t="clients">Clients</button>
    <button data-t="onboarding">Onboarding</button>
    <button data-t="inboxes">Inboxes</button>
    <button data-t="acquisition">Acquisition</button>
    <button data-t="buy">Buy</button>
    <button data-t="pools">Pools</button>
  </nav>
</div>
<main>
  <div id="banners"></div>
  <div id="overview"></div>
  <div id="clients" hidden></div>
  <div id="onboarding" hidden></div>
  <div id="inboxes" hidden></div>
  <div id="acquisition" hidden></div>
  <div id="buy" hidden></div>
  <div id="pools" hidden></div>
</main>
<script>
// ── auth ────────────────────────────────────────────────────────────────
// The password lives in a cookie, set once, exactly like the existing
// dashboard. A ?pw= in the URL is accepted, immediately stored, and then
// STRIPPED from the address bar — a password in a URL survives in browser
// history, in screenshots, and in any link that gets forwarded.
function cookie(name){
  const m = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
  return m ? m[2] : '';
}
function setPw(v){
  document.cookie = 'dashboard_pw=' + encodeURIComponent(v) + ';path=/;max-age=31536000;samesite=lax';
}
(function absorbUrlPw(){
  const u = new URL(location.href);
  const p = u.searchParams.get('pw');
  if (p) {
    setPw(p);
    u.searchParams.delete('pw');
    history.replaceState(null, '', u.pathname + (u.search || '') + u.hash);
  }
})();
async function api(path){
  const r = await fetch(path, {credentials: 'same-origin'});
  if (r.status === 401) {
    const p = prompt('Dashboard password:');
    if (p) { setPw(p); location.reload(); }
    return {error: 'not signed in'};
  }
  const j = await r.json().catch(() => ({error: 'bad JSON from ' + path}));
  return r.ok ? j : {error: j.error || ('HTTP ' + r.status)};
}
async function post(path, body){
  const r = await fetch(path, {method: 'POST', credentials: 'same-origin',
    headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
  if (r.status === 401) { const p = prompt('Dashboard password:'); if (p) { setPw(p); location.reload(); }
    return {error: 'not signed in'}; }
  const j = await r.json().catch(() => ({error: 'bad JSON from ' + path}));
  return r.ok ? j : {error: j.error || ('HTTP ' + r.status), refused: j.refused};
}
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const money = n => '$' + Number(n || 0).toLocaleString();

function ago(s){
  if (s == null) return 'age unknown';
  if (s < 90) return s + 's ago';
  if (s < 5400) return Math.round(s/60) + 'm ago';
  if (s < 172800) return (s/3600).toFixed(1) + 'h ago';
  return Math.round(s/86400) + 'd ago';
}

let DATA = {};

const get = api;

function card(k, v, cls){ return `<div class="c ${cls||''}"><div class="k">${k}</div><div class="v">${v}</div></div>`; }

function renderOverview(){
  const inv = DATA.invariants || {}, cl = DATA.clients || {};
  const s = cl.summary || {}, c = inv.counts || {};
  const el = document.getElementById('overview');
  if (inv.error && cl.error) { el.innerHTML = `<div class="empty">Both feeds failed: ${esc(inv.error)}</div>`; return; }

  let html = '<div class="cards">'
    + card('Rules failing', c.FAIL ?? '–', c.FAIL ? 'bad' : 'ok')
    + card('Active clients', s.active_clients ?? '–')
    + card('Client inboxes', s.inboxes ?? '–')
    + card('Monthly cost', s.monthly_cost != null ? money(s.monthly_cost) : '–')
    + card('Off target', s.off_target ?? '–', s.off_target ? 'warn' : 'ok')
    + card('Decisions ≤30d', s.decisions_due_30d ?? '–', s.decisions_due_30d ? 'warn' : '')
    + card('Needs replacing', (DATA.inboxes || {}).summary?.actionable_burned ?? '–',
           (DATA.inboxes || {}).summary?.actionable_burned ? 'bad' : 'ok')
    + card('Onboarding owed', (() => {
        const o = (DATA.onboarding || {}).summary || {};
        return o.needs_work != null ? o.needs_work : '–';
      })(), ((DATA.onboarding || {}).summary || {}).needs_work ? 'warn' : 'ok')
    + card('Acq. free', (() => {
        const a = (DATA.acquisition || {}).summary || {};
        return a.free_inboxes != null ? a.free_inboxes : '?';
      })(), 'warn')
    + '</div>';

  html += '<h2>The ten rules</h2>';
  if (inv.error) {
    html += `<div class="empty">${esc(inv.error)}</div>`;
  } else {
    html += (inv.results || []).map(r => `
      <div class="rule">
        <span class="st ${r.status === 'PASS' ? 'good' : r.status === 'FAIL' ? 'bad' : 'warn'}">${r.status}</span>
        <span class="nm">${esc(r.name)}</span>
        <span class="dt">${esc(r.detail || '')}</span>
      </div>
      ${(r.violations || []).length ? '<div class="viol">'
        + r.violations.slice(0, 6).map(v => `<div>${esc(v)}</div>`).join('')
        + (r.violation_count > 6 ? `<div class="dim">…and ${r.violation_count - 6} more</div>` : '')
        + '</div>' : ''}`).join('');
  }
  el.innerHTML = html;
}

function renderClients(){
  const d = DATA.clients || {};
  const el = document.getElementById('clients');
  if (d.error) { el.innerHTML = `<div class="empty">${esc(d.error)}</div>`; return; }
  const rows = (d.clients || []).map(c => {
    const tgt = c.exempt ? '<span class="tag">free</span>' : c.target;
    const dl = c.exempt ? '' :
      (c.delta === 0 ? '<span class="good">0</span>'
        : `<span class="bad">${c.delta > 0 ? '+' : ''}${c.delta}</span>`);
    const days = c.days_to_decision;
    const when = c.decide_by
      ? `${c.decide_by}${days != null ? ` <span class="dim">(${days}d)</span>` : ''}`
      : '<span class="dim">—</span>';
    const basis = c.term_is_a_guess
      ? `<span class="warn">${esc(c.term_basis)}</span>` : `<span class="dim">${esc(c.term_basis || '')}</span>`;
    // A free account shows no dates at all: there is no contract to run out.
    return `<tr>
      <td>${esc(c.name)}${c.seasonal ? ' <span class="tag">seasonal</span>' : ''}</td>
      <td class="n">${c.inboxes}</td><td class="n">${tgt}</td><td class="n">${dl}</td>
      <td class="n dim">${c.monthly_cost != null ? money(c.monthly_cost) : ''}</td>
      <td>${esc(c.term_ends || '—')}</td><td>${when}</td><td>${esc(c.hard_stop || '—')}</td>
      <td>${basis}</td></tr>`;
  }).join('');
  el.innerHTML = `<h2>Active clients — ${(d.clients || []).length}</h2>
    <div class="wrap"><table>
      <tr><th>Client</th><th>Inboxes</th><th>Target</th><th>Δ</th><th>$/mo</th>
          <th>Term ends</th><th>Decide by</th><th>Hard stop</th><th>Term basis</th></tr>
      ${rows}</table></div>
    <div class="meta" style="margin-top:10px">Renewal dates come from the contracted term in the CRM.
      A highlighted basis means the term was assumed, not recorded — that deadline is a guess.</div>`;
}

// ── Onboarding ─────────────────────────────────────────────────────────
// The CRM decides who is a client; this says what infrastructure still owes
// them. It reports and never acts: buying inboxes and setting forwarding both
// cost money or move live sending, so the buttons stay on the tabs that own
// them. A screen that silently fixed things is a screen you cannot trust to
// tell you what is wrong.
const STEP_TAB = {infra: 'buy', target: 'buy', forwarding: 'clients', launch: null};

function renderOnboarding(){
  const d = DATA.onboarding || {};
  const el = document.getElementById('onboarding');
  if (d.error) { el.innerHTML = `<div class="empty">${esc(d.error)}</div>`; return; }
  const s = d.summary || {};

  let html = '<div class="cards">'
    + card('Fully onboarded', `${s.complete ?? 0} <span class="dim" style="font-size:13px">of ${s.active_clients ?? 0}</span>`,
           s.needs_work ? '' : 'ok')
    + card('Needs work', s.needs_work ?? '\u2013', s.needs_work ? 'warn' : 'ok')
    + card('No infra at all', s.no_infra ?? '\u2013', s.no_infra ? 'bad' : 'ok')
    + card('Below target', s.below_target ?? '\u2013', s.below_target ? 'warn' : 'ok')
    + card('Forwarding wrong', s.bad_forwarding ?? '\u2013', s.bad_forwarding ? 'bad' : 'ok')
    + card('Inboxes to buy', s.inboxes_to_buy ?? '\u2013', s.inboxes_to_buy ? 'warn' : 'ok')
    + '</div>';

  if (s.forwarding_checked === false)
    html += `<div class="banner">Zapmail could not be read, so forwarding was not checked on
      anyone. Nothing below is a clean bill of health.</div>`;

  html += `<h2>Owed to a live client \u2014 ${(d.queue || []).length}</h2>`;
  if (!(d.queue || []).length) {
    html += '<div class="empty">Every active client in the CRM has its infrastructure, '
          + 'at target, forwarding to its own website.</div>';
  } else {
    html += `<div class="wrap"><table>
      <tr><th>Client</th><th>Blocked on</th><th>Inboxes</th><th>Short</th><th>What is missing</th><th></th></tr>
      ${d.queue.map(e => {
        const lbl = (d.step_labels || {})[e.blocking] || e.blocking || '';
        const tab = STEP_TAB[e.blocking];
        const go = tab ? `<button class="act" data-goto="${tab}">Go to ${tab}</button>` : '';
        return `<tr>
          <td>${esc(e.client)}</td>
          <td class="${e.blocking === 'infra' || e.blocking === 'forwarding' ? 'bad' : 'warn'}">${esc(lbl)}</td>
          <td class="n">${e.inboxes}<span class="dim">/${e.target}</span></td>
          <td class="n">${e.short || ''}</td>
          <td class="dim">${(e.notes || []).map(esc).join('<br>')}</td>
          <td>${go}</td></tr>`;
      }).join('')}
    </table></div>
    <div class="meta" style="margin-top:10px">Order matters: a client with no inboxes is not also
      reported for forwarding. Nothing on this tab changes anything \u2014 it is the list, not the fix.</div>`;
  }

  if ((d.complete || []).length)
    html += `<h2>Fully onboarded \u2014 ${d.complete.length}</h2>
      <div class="meta">${d.complete.map(esc).join(' \u00b7 ')}</div>`;

  el.innerHTML = html;
  el.querySelectorAll('button[data-goto]').forEach(b => b.onclick = () => {
    const t = b.dataset.goto;
    document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x.dataset.t === t));
    ['overview','clients','onboarding','inboxes','acquisition','buy','pools'].forEach(n =>
      document.getElementById(n).hidden = (n !== t));
    showTab(t);
  });
}

function renderInboxes(){
  const d = DATA.inboxes || {};
  const el = document.getElementById('inboxes');
  if (d.error) { el.innerHTML = `<div class="empty">${esc(d.error)}</div>`; return; }
  if (d.loading) { el.innerHTML = '<div class="empty">Health cache is empty — run the sync.</div>'; return; }
  const s = d.summary || {}, c = d.counts || {};
  const need = s.needed_by_vertical || {};
  const shortService = (need.service || 0) > 0 && !(s.service_reserve > 0);

  const b = d.burn_rate || {}, bs = b.summary || {};
  const rate = bs.per_week, runway = bs.runway_weeks;

  let html = '<div class="cards">'
    + card('Needs replacing', s.actionable_burned ?? '–', s.actionable_burned ? 'bad' : 'ok')
    + card('Burn rate', b.measured ? `${rate}<span class="dim" style="font-size:13px">/wk</span>` : '?',
           !b.measured ? 'warn' : rate >= 5 ? 'bad' : rate > 0 ? 'warn' : 'ok')
    + card('Replacement pool', s.replacement ?? '–', (s.replacement ?? 0) ? '' : 'bad')
    + card('Runway', runway != null ? `${runway}<span class="dim" style="font-size:13px"> wk</span>`
                                    : (b.measured ? 'n/a' : '?'),
           runway == null ? '' : runway < 4 ? 'bad' : runway < 12 ? 'warn' : 'ok')
    + card('At risk', bs.at_risk ?? '–', (bs.at_risk ?? 0) > 200 ? 'warn' : '')
    + card('Burned total', s.burned ?? '–')
    + card('Reserve', s.reserve ?? '–')
    + card('Fleet', s.inboxes ?? '–')
    + '</div>';

  if (!b.measured)
    html += `<div class="banner">${esc(b.reason || 'Burn rate could not be computed')} —
      the rate is withheld rather than shown low. A rate built from a short read always
      looks healthy.</div>`;
  else if (b.window_complete === false)
    html += `<div class="banner">The window reaches back before ${esc(b.history_from)}, which is
      the earliest date health history is true. Crossings before then are missing, so this
      rate is a floor, not the real number.</div>`;

  if (b.measured && (b.weeks || []).length) {
    const mx = Math.max(1, ...b.weeks.map(w => w.new_burns));
    html += '<h2>New burns by week</h2><div class="wrap"><table>'
      + '<tr><th>Week</th><th>New burns</th><th style="width:55%"></th></tr>'
      + b.weeks.map(w => `<tr><td class="dim">${esc(w.from)}</td>
          <td class="n">${w.new_burns}</td>
          <td><span style="display:inline-block;height:9px;border-radius:2px;
            background:${w.new_burns >= 5 ? 'var(--bad)' : 'var(--warn)'};
            width:${Math.round(100 * w.new_burns / mx)}%"></span></td></tr>`).join('')
      + '</table></div>'
      + `<div class="meta" style="margin-top:8px">New burns are inboxes that were not burned
         at the previous snapshot — net change would let a cancelled inbox cancel out a
         genuinely new one.
         ${runway != null
            ? `At ${rate}/week the ${bs.replacement_pool} in the Replacement Group cover ${runway} weeks.`
            : 'Nothing is burning, so there is no runway to quote — that is not a reason to shrink the pool.'}</div>`;
  }

  if (shortService)
    html += `<div class="banner">${need.service} burned service inbox(es) and no service reserve to
      replace them from. Every reserve domain is landscaping — leave them in place rather than
      moving a service client onto a lawn-care domain.</div>`;

  html += '<h2>Health</h2><div class="wrap"><table><tr>'
    + ['healthy','watch','at_risk','burned','warming','idle','insufficient']
        .map(k => `<th>${k.replace('_',' ')}</th>`).join('')
    + '</tr><tr>'
    + ['healthy','watch','at_risk','burned','warming','idle','insufficient']
        .map(k => `<td class="n">${c[k] ?? 0}</td>`).join('')
    + '</tr></table></div>';

  const act = (d.burned || []).filter(b => b.actionable);
  const dead = (d.burned || []).filter(b => !b.actionable);
  html += `<h2>Burned on a live client — ${act.length}</h2>`;
  html += act.length ? `<div class="wrap"><table>
      <tr><th>Inbox</th><th>Client</th><th>Domain type</th><th>Bounce 3d</th><th>Reply 3d</th><th>Why</th></tr>
      ${act.map(b => `<tr><td>${esc(b.email)}</td><td>${esc(b.client)}</td>
        <td><span class="tag">${esc(b.vertical)}</span></td>
        <td class="n bad">${b.bounce_3d ?? ''}</td><td class="n dim">${b.reply_3d ?? ''}</td>
        <td class="dim">${esc(b.reason || '')}</td></tr>`).join('')}
    </table></div>
    <div class="meta" style="margin-top:10px">Check each for positive replies before swapping — a replied-to
      thread stays welded to the inbox that sent it. After re-tagging, hit <b>Reallocate Mailboxes</b> on the
      campaign; there is no API for that step.</div>`
    : '<div class="empty">Nothing burned on a live client.</div>';

  if (dead.length)
    html += `<h2>Burned but already cancelled — ${dead.length}</h2>
      <div class="meta">No action: these sit in a cleanup bucket and disappear on their billing date.</div>`;
  el.innerHTML = html;
}

function renderAcquisition(){
  const d = DATA.acquisition || {};
  const el = document.getElementById('acquisition');
  if (d.error) { el.innerHTML = `<div class="empty">${esc(d.error)}</div>`; return; }
  const s = d.summary || {};

  // free_inboxes is deliberately nullable: null means the send rows were
  // unreadable, and printing 0 there would read as "nothing spare" — a
  // confident answer we do not have.
  const freeKnown = s.free_inboxes != null;
  const freeVal = freeKnown ? `${s.free_inboxes} <span class="dim" style="font-size:13px">/ ${s.free_capacity}\u2009a day</span>` : '?';

  // IN USE = on a live campaign: sending to new leads, sending follow-ups, or
  // between sequence steps. All three are working states. The old headline
  // divided sends/day by capacity/day, which counted a follow-up sequence's
  // deliberately spaced touches as waste and reported a 99%-deployed fleet as
  // 27% used.
  const used = s.in_use_pct;
  let html = '<div class="cards">'
    + card('In use', used != null ? used + '%' : '\u2013',
           used == null ? '' : used >= 90 ? 'ok' : used >= 70 ? 'warn' : 'bad')
    + card('Working', `${s.in_use ?? '\u2013'} <span class="dim" style="font-size:13px">of ${s.usable ?? '\u2013'}</span>`)
    + card('Free to reallocate', freeVal, freeKnown ? (s.free_inboxes ? 'ok' : 'warn') : 'warn')
    + card('Inboxes', s.inboxes ?? '\u2013')
    + card('Domains', s.domains ?? '\u2013')
    + card('Burned', s.burned ?? '\u2013', s.burned ? 'bad' : 'ok')
    + card('Replacement pool', s.replacement_pool != null ? s.replacement_pool : '?',
           s.replacement_pool === 0 ? 'bad' : '')
    + card('Over 3 / domain', s.over_cap_domains ?? '\u2013', s.over_cap_domains ? 'bad' : 'ok')
    + '</div>';

  // Volume, stated as volume, with no claim attached. A follow-up-heavy fleet
  // sends less per inbox by design; that is the sequence spacing its touches.
  html += `<div class="meta" style="margin:-8px 0 16px">Sending
    ${(s.actual_per_day ?? 0).toLocaleString()} a day across ${s.in_use ?? '?'} working inboxes.
    Daily volume is set by where each campaign is in its sequence, so it is not a
    utilisation figure \u2014 an inbox between sequence steps sends nothing today and is
    still working.</div>`;

  (d.notes || []).forEach(n => html += `<div class="banner">${esc(n)}</div>`);
  if (s.registrar_read === false)
    html += `<div class="banner">The registrar could not be read, so no domain here has a
      verified expiry. Nothing below is an all-clear.</div>`;

  html += '<h2>What the fleet is doing</h2><div class="wrap"><table>'
    + '<tr><th>State</th><th>Inboxes</th><th>Capacity / day</th></tr>'
    + (d.by_state || []).map(r => `<tr><td>${esc(r.state)}</td>
        <td class="n">${r.inboxes}</td><td class="n dim">${r.capacity}</td></tr>`).join('')
    + '</table></div>';

  html += `<h2>Free to point somewhere new \u2014 ${freeKnown ? (d.free || []).length : 'unknown'}</h2>`;
  if (!freeKnown) {
    html += '<div class="empty">No daily send rows, so this cannot be answered. '
          + 'Run the health sync.</div>';
  } else if (!(d.free || []).length) {
    html += '<div class="empty">Nothing is free. Every acquisition inbox is either sending, '
          + 'still working through follow-ups, or blocked.</div>';
  } else {
    html += `<div class="wrap"><table>
      <tr><th>Inbox</th><th>Group</th><th>Per day</th><th>Age</th><th>Why it is idle</th></tr>
      ${(d.free || []).map(i => `<tr><td>${esc(i.email)}</td><td class="dim">${esc(i.group || '')}</td>
        <td class="n">${i.per_day}</td><td class="n dim">${i.age_days != null ? i.age_days + 'd' : ''}</td>
        <td class="dim">${esc(i.why || i.state)}</td></tr>`).join('')}
    </table></div>
    <div class="meta" style="margin-top:10px">Measured over ${esc(s.window_from || '')}\u2013${esc(s.window_to || '')}
      (${s.window_sending_days ?? '?'} sending days): campaign state said idle AND the mailbox sent nothing.
      An inbox in the gap between sequence steps sends nothing today but did this week, so it is not here.</div>`;
  }

  if ((d.burned || []).length)
    html += `<h2 class="bad">Burned \u2014 ${d.burned.length}</h2>
      <div class="wrap"><table>
        <tr><th>Inbox</th><th>Group</th><th>Bounce 3d</th><th>Reply 3d</th><th>Per day</th></tr>
        ${d.burned.map(b => `<tr><td>${esc(b.email)}</td><td class="dim">${esc(b.group || '')}</td>
          <td class="n bad">${b.bounce_3d ?? ''}</td><td class="n dim">${b.reply_3d ?? ''}</td>
          <td class="n dim">${b.per_day ?? ''}</td></tr>`).join('')}
      </table></div>
      <div class="meta" style="margin-top:10px">Swap each from the Replacement Group
        ${s.replacement_pool != null ? `(${s.replacement_pool} available)` : '(size unknown)'}.
        Check for positive replies first \u2014 a replied-to thread stays welded to the inbox
        that sent it.</div>`;

  if ((d.lapsing || []).length)
    html += `<h2 class="bad">Lapsing with live senders \u2014 ${d.lapsing.length}</h2>
      <div class="wrap"><table>
        <tr><th>Domain</th><th>Expires</th><th>Days</th><th>Sending</th><th>Registrar</th></tr>
        ${d.lapsing.map(r => `<tr><td>${esc(r.domain)}</td><td>${esc(r.expires)}</td>
          <td class="n bad">${r.days_to_expiry}</td><td class="n">${r.sending}</td>
          <td class="dim">${esc(r.registrar || '')}</td></tr>`).join('')}
      </table></div>`;

  if ((d.over_cap || []).length)
    html += `<h2 class="bad">More than ${d.max_per_domain} inboxes on one domain \u2014 ${d.over_cap.length}</h2>
      <div class="wrap"><table>
        <tr><th>Domain</th><th>Inboxes</th><th>Sending</th></tr>
        ${d.over_cap.map(r => `<tr><td>${esc(r.domain)}</td><td class="n bad">${r.inboxes}</td>
          <td class="n">${r.sending}</td></tr>`).join('')}
      </table></div>
      <div class="meta" style="margin-top:10px">One bounce pattern takes out every mailbox on the domain,
        and the oldest one is an admin that cannot be removed while the others remain.</div>`;

  html += `<h2>Domains \u2014 ${(d.domains || []).length}</h2><div class="wrap"><table>
    <tr><th>Domain</th><th>Inboxes</th><th>Sending</th><th>Free</th><th>Expires</th><th>Auto-renew</th><th>Registrar</th></tr>
    ${(d.domains || []).map(r => {
      const ar = r.auto_renew == null ? '<span class="dim">unknown</span>'
               : r.auto_renew ? '<span class="good">on</span>' : '<span class="bad">off</span>';
      const exp = r.expires
        ? `${esc(r.expires)}${r.days_to_expiry != null ? ` <span class="dim">(${r.days_to_expiry}d)</span>` : ''}`
        : '<span class="dim">unknown</span>';
      return `<tr><td>${esc(r.domain)}${r.over_cap ? ' <span class="tag bad">over cap</span>' : ''}</td>
        <td class="n">${r.inboxes}</td><td class="n dim">${r.sending}</td>
        <td class="n">${r.free || ''}</td><td>${exp}</td><td>${ar}</td>
        <td class="dim">${esc(r.registrar || '')}</td></tr>`;
    }).join('')}
  </table></div>`;

  el.innerHTML = html;
}

// ── Buy ────────────────────────────────────────────────────────────────
// Three phases, and the money moves only in the middle one. Suggest and plan
// spend nothing; "Register" spends on domains; "Provision" spends on mailbox
// slots. Each spending button states the figure before it is pressed.
//
// Google only — there is no Outlook option here, and the API refuses one even
// if a request is hand-made.
const BUY = {suggest: [], chosen: new Set(), plan: null, orders: [], busy: false};

function buyChrome(){
  return `<h2>1 · Find domains</h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
      <select id="b-owner" class="act">
        <option value="acquisition">Acquisition (ours)</option>
        <option value="client">A client</option>
      </select>
      <input id="b-client" class="act" placeholder="client name" style="display:none">
      <select id="b-theme" class="act" style="display:none">
        <option value="">Generic service</option>
        <option value="hvac">HVAC</option>
        <option value="plumbing">Plumbing</option>
        <option value="landscaping">Landscaping</option>
      </select>
      <span class="dim" id="b-brandnote">names built from <b>The Headline Theory</b></span>
      <select id="b-tld" class="act"><option>info</option><option>co</option><option>com</option></select>
      <input id="b-count" class="act" type="number" value="12" min="1" max="40" style="width:70px">
      <button class="act" id="b-suggest">Suggest</button>
      <span class="dim">or</span>
      <input id="b-manual" class="act" placeholder="your-own-domain.info" style="min-width:220px">
      <button class="act" id="b-add">Add</button>
    </div>
    <div id="b-suggestions"></div>
    <div id="b-plan"></div>
    <h2>Orders</h2><div id="b-orders"></div>
    <div class="meta" style="margin-top:10px">Google mailboxes only, three per domain.
      Provisioning resumes across calls — DNS can take an hour, and a request that
      returns "resume" is waiting, not failing.</div>`;
}

function renderBuy(){
  const el = document.getElementById('buy');
  if (!el.dataset.built) { el.innerHTML = buyChrome(); el.dataset.built = '1'; wireBuy(); }
  renderSuggestions(); renderPlan(); renderOrders();
}

function renderSuggestions(){
  const d = document.getElementById('b-suggestions');
  if (!d) return;
  if (!BUY.suggest.length) { d.innerHTML = '<div class="empty">No candidates yet.</div>'; return; }
  d.innerHTML = `<div class="wrap"><table>
    <tr><th></th><th>Domain</th><th>First year</th></tr>
    ${BUY.suggest.map(x => `<tr><td><input type="checkbox" data-d="${esc(x.domain)}"
        ${BUY.chosen.has(x.domain) ? 'checked' : ''}></td>
      <td>${esc(x.domain)}</td><td class="n dim">${money(x.price)}</td></tr>`).join('')}
    </table></div>
    <div style="margin-top:10px"><button class="act" id="b-plan-btn">Price it up</button>
      <span class="dim" id="b-chosen">${BUY.chosen.size} selected</span></div>`;
  d.querySelectorAll('input[type=checkbox]').forEach(cb => cb.onchange = () => {
    cb.checked ? BUY.chosen.add(cb.dataset.d) : BUY.chosen.delete(cb.dataset.d);
    document.getElementById('b-chosen').textContent = BUY.chosen.size + ' selected';
  });
  document.getElementById('b-plan-btn').onclick = doPlan;
}

function renderPlan(){
  const d = document.getElementById('b-plan'); if (!d) return;
  const p = BUY.plan;
  if (!p) { d.innerHTML = ''; return; }
  if (p.error) { d.innerHTML = `<div class="banner">${esc(p.error)}</div>`; return; }
  const c = p.cost || {}, n = p.counts || {};
  d.innerHTML = `<h2>2 · What it costs</h2>
    <div class="cards">
      ${card('Domains available', n.available ?? 0)}
      ${card('Mailboxes', n.mailboxes ?? 0)}
      ${card('Domains, once', money(c.domains_onetime))}
      ${card('Mailboxes / mo', money(c.mailboxes_monthly))}
      ${card('First month', money(c.first_month_total), 'warn')}
    </div>
    ${n.unavailable ? `<div class="banner">${n.unavailable} taken, ${n.unknown || 0} unknown — those are dropped.</div>` : ''}
    <button class="act" id="b-buy" ${p.ready_to_buy ? '' : 'disabled'}>
      Register ${n.available ?? 0} domain(s) — ${money(c.domains_onetime)} now</button>
    <span class="dim"> Mailboxes are bought later, at provisioning.</span>`;
  const b = document.getElementById('b-buy');
  if (b) b.onclick = doBuy;
}

function renderOrders(){
  const d = document.getElementById('b-orders'); if (!d) return;
  if (!BUY.orders.length) { d.innerHTML = '<div class="empty">No orders yet.</div>'; return; }
  d.innerHTML = BUY.orders.map(o => {
    const j = o.journal || {};
    const step = j.step || (o.status === 'live' ? 'done' : 'dns');
    const r = o.readiness || {};
    const ready = r.ready_count != null ? `${r.ready_count}/${(r.domains || []).length} DNS ready` : '';
    return `<div class="c" style="margin-bottom:10px">
      <div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">
        <b>Order ${o.id}</b>
        <span class="tag">${esc(o.client_name || o.owner)}</span>
        <span class="tag">${esc(o.provider || 'GOOGLE')}</span>
        <span class="${step === 'done' ? 'good' : 'warn'}">${esc(step)}</span>
        <span class="dim">${(o.domains || []).length} domains · ${ready}</span>
        <span style="flex:1"></span>
        ${step === 'done' ? '' :
          `<button class="act" data-prov="${o.id}">Provision now</button>`}
      </div>
      <div class="dim" style="margin-top:6px;font-size:11.5px">${(o.domains || []).join(', ')}</div>
      ${j.blocked_reason ? `<div class="viol" style="margin-left:0">${esc(j.blocked_reason)}</div>` : ''}
      ${(j.log || []).length ? `<div class="dim" style="margin-top:6px;font-size:11px">${
        (j.log || []).slice(-6).map(l => esc(l)).join('<br>')}</div>` : ''}
    </div>`;
  }).join('');
  d.querySelectorAll('button[data-prov]').forEach(b => b.onclick = () => doProvision(b.dataset.prov, b));
}

function wireBuy(){
  // Acquisition buys OUR brand, so the vertical picker is meaningless there —
  // it was offering generic service names for a THT prospecting batch.
  const ownerChanged = () => {
    const client = document.getElementById('b-owner').value === 'client';
    document.getElementById('b-client').style.display = client ? '' : 'none';
    document.getElementById('b-theme').style.display = client ? '' : 'none';
    document.getElementById('b-brandnote').style.display = client ? 'none' : '';
  };
  document.getElementById('b-owner').onchange = ownerChanged;
  ownerChanged();
  document.getElementById('b-suggest').onclick = async (e) => {
    e.target.disabled = true; e.target.textContent = 'checking…';
    const owner = document.getElementById('b-owner').value;
    const body = {count: +document.getElementById('b-count').value || 12,
                  tld: document.getElementById('b-tld').value, owner};
    const cn = (document.getElementById('b-client').value || '').trim();
    if (owner === 'client') {
      body.theme = document.getElementById('b-theme').value || undefined;
      if (cn) body.brand = cn;
    }
    // owner === 'acquisition' sends no brand: the API fills in ours, so a
    // hand-made request gets the same answer as the page.
    const r = await post('/api/buy-suggest', body);
    e.target.disabled = false; e.target.textContent = 'Suggest';
    BUY.suggest = r.suggestions || [];
    if (r.error) BUY.plan = {error: r.error};
    renderSuggestions(); renderPlan();
  };
  document.getElementById('b-add').onclick = () => {
    const v = (document.getElementById('b-manual').value || '').trim().toLowerCase();
    if (!v) return;
    if (!BUY.suggest.some(x => x.domain === v)) BUY.suggest.unshift({domain: v, price: 0});
    BUY.chosen.add(v);
    document.getElementById('b-manual').value = '';
    renderSuggestions();
  };
}

function buySpec(){
  const owner = document.getElementById('b-owner').value;
  return {owner, client_name: owner === 'client'
            ? (document.getElementById('b-client').value || '').trim() : null,
          provider: 'google', inboxes_per_domain: 3,
          domains: [...BUY.chosen]};
}

async function doPlan(){
  if (!BUY.chosen.size) return;
  BUY.plan = {error: 'checking availability…'}; renderPlan();
  BUY.plan = await post('/api/buy-plan', buySpec());
  renderPlan();
}

async function doBuy(){
  const p = BUY.plan || {}, c = p.cost || {}, n = p.counts || {};
  if (!confirm(`Register ${n.available} domain(s) for ${money(c.domains_onetime)}?\n\n`
             + `This spends money now. Mailboxes (${money(c.mailboxes_monthly)}/mo) are `
             + `bought later, when you press Provision.`)) return;
  const b = document.getElementById('b-buy');
  b.disabled = true; b.textContent = 'registering…';
  const r = await post('/api/buy-domains', {...buySpec(), confirm: true});
  if (r.error) { alert(r.error); b.disabled = false; b.textContent = 'Register'; return; }
  BUY.chosen.clear(); BUY.plan = null;
  await loadOrders(); renderBuy();
}

// Provisioning answers `resume: true` while DNS propagates or an export
// settles. That is the normal state for the first hour, so the button keeps
// asking on a timer rather than making someone click twenty times — and stops
// the moment the order is done or genuinely blocked.
async function doProvision(id, btn){
  if (BUY.busy) return;
  BUY.busy = true;
  const dry = await post('/api/buy-provision', {order_id: +id});
  if (dry.error) { alert(dry.error); BUY.busy = false; return; }
  if (!confirm(`Provision order ${id}?\n\n${dry.ready_count ?? 0} of `
             + `${(dry.domains || []).length} domains have DNS ready. This buys mailbox `
             + `slots ($3/mailbox/month) and starts 14 days of warm-up.`)) { BUY.busy = false; return; }
  let tries = 0;
  const tick = async () => {
    btn.textContent = `working… (${++tries})`;
    const r = await post('/api/buy-provision', {order_id: +id, confirm: true});
    await loadOrders(); renderOrders();
    if (r.error) { alert(r.error); BUY.busy = false; return; }
    if (r.done) { BUY.busy = false; return; }
    if (!r.resume) { BUY.busy = false; return; }   // blocked; the reason is on the order
    setTimeout(tick, 30000);
  };
  tick();
}

async function loadOrders(){
  const r = await get('/api/buy-orders');
  BUY.orders = r.orders || [];
}

function renderPools(){
  const d = DATA.clients || {};
  const el = document.getElementById('pools');
  if (d.error) { el.innerHTML = `<div class="empty">${esc(d.error)}</div>`; return; }
  const rows = (d.pools || []).map(p => `<tr><td>${esc(p.name)}</td>
    <td class="n">${p.inboxes}</td><td class="n dim">${money(p.monthly_cost)}</td></tr>`).join('');
  el.innerHTML = `<h2>Pools — inboxes with no client attached</h2>
    <div class="wrap"><table>
      <tr><th>Pool</th><th>Inboxes</th><th>$/mo</th></tr>${rows}</table></div>
    <div class="meta" style="margin-top:10px">Stock that can still be given to a client.
      Reserve is Generic Landscaping 1 + 2 (84 = two clients' worth); Replacement Group is separate,
      for swapping burned inboxes. Acquisition is not listed here \u2014 it is our own prospecting
      fleet, already deployed, and it has its own tab.</div>`;
}

function banners(){
  const inv = DATA.invariants || {}, cl = DATA.clients || {};
  let h = '';
  if (inv.stale) h += `<div class="banner">Rule results are ${ago(inv.age_seconds)} — the daily cron may not have run.</div>`;
  if (cl._stale) h += `<div class="banner">Client data is ${ago(cl._age_seconds)} and was rebuilt on request.</div>`;
  if (inv.active_campaigns === 0) h += `<div class="banner">0 ACTIVE campaigns. Anything keyed on campaign membership was skipped, not passed.</div>`;
  (inv.sources_unavailable || []).forEach(s => h += `<div class="banner">Source unavailable: ${esc(s)} — rules needing it were skipped.</div>`);
  document.getElementById('banners').innerHTML = h;
}

// Every tab used to be fetched before anything rendered, so opening the
// dashboard waited on the SLOWEST of five endpoints — several of which rebuild
// a whole Zapmail or Smartlead walk on a cache miss. Nobody needs the
// acquisition fleet to read the Overview.
//
// Now: Overview's two feeds load first and the page paints. Every other tab
// fetches the first time it is opened and is remembered after that. Reload
// re-fetches whatever is already on screen.
const FEEDS = {
  invariants:  '/api/invariants',
  clients:     '/api/clients',
  inboxes:     '/api/inboxes',
  acquisition: '/api/acquisition',
  onboarding:  '/api/onboarding',
};
const RENDER = {
  overview: renderOverview, clients: renderClients, onboarding: renderOnboarding,
  inboxes: renderInboxes, acquisition: renderAcquisition, pools: renderPools,
};
// Which feeds a tab needs before it can draw.
const TAB_FEEDS = {
  overview: ['invariants', 'clients'],
  clients: ['clients'], onboarding: ['onboarding'], inboxes: ['inboxes'],
  acquisition: ['acquisition'], pools: ['clients'], buy: [],
};
const LOADED = {};

async function need(keys, force){
  const want = keys.filter(k => force || !(k in LOADED));
  if (want.length) {
    const got = await Promise.all(want.map(k => get(FEEDS[k])));
    want.forEach((k, i) => { DATA[k] = got[i]; LOADED[k] = true; });
  }
}

function stamp(){
  const bits = [];
  const cl = DATA.clients, inv = DATA.invariants;
  if (cl && !cl.error) bits.push('clients ' + ago(cl._age_seconds));
  if (inv && !inv.error) bits.push('rules ' + ago(inv.age_seconds));
  document.getElementById('meta').textContent = bits.join(' · ') || 'no data';
}

let CURRENT = 'overview';

async function showTab(t, force){
  CURRENT = t;
  const el = document.getElementById(t);
  const pending = (TAB_FEEDS[t] || []).some(k => force || !(k in LOADED));
  if (pending && RENDER[t]) el.innerHTML = '<div class="empty">loading…</div>';
  await need(TAB_FEEDS[t] || [], force);
  stamp(); banners();
  if (RENDER[t]) RENDER[t]();
  if (t === 'buy') { await loadOrders(); renderBuy(); }
}

async function load(){
  document.getElementById('meta').textContent = 'loading…';
  await showTab(CURRENT, true);
  // Overview quotes one number off the other tabs. Fetch them after the page
  // has painted, then repaint the cards — never before the first render.
  if (CURRENT === 'overview') {
    need(['inboxes', 'acquisition', 'onboarding']).then(() => {
      if (CURRENT === 'overview') renderOverview();
    });
  }
}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  ['overview','clients','onboarding','inboxes','acquisition','buy','pools'].forEach(t =>
    document.getElementById(t).hidden = (t !== b.dataset.t));
  showTab(b.dataset.t);
});
document.getElementById('reload').onclick = () => showTab(CURRENT, true);
load();
</script>
</body>
