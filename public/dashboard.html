<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sending infrastructure</title>
<style>
  :root{
    --bg:#0e1116; --card:#161b22; --line:#232a33; --line2:#2f3945;
    --ink:#e6edf3; --dim:#8b949e; --dim2:#6e7781;
    --ok:#3fb950; --bad:#f85149; --warn:#d29922; --accent:#58a6ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:13.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
       padding:0 0 60px}
  .top{border-bottom:1px solid var(--line);padding:16px 22px 0;position:sticky;top:0;
       background:var(--bg);z-index:5}
  .ttl{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}
  h1{font-size:16px;margin:0;letter-spacing:-.01em}
  .meta{color:var(--dim);font-size:11.5px}
  nav{display:flex;gap:2px}
  nav button{background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);
             font:inherit;font-size:12.5px;padding:7px 14px;cursor:pointer}
  nav button:hover{color:var(--ink)}
  nav button.on{color:var(--ink);border-bottom-color:var(--accent)}
  main{padding:20px 22px;max-width:1180px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px}
  .c{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
  .c .k{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  .c .v{font-size:22px;margin-top:5px;font-variant-numeric:tabular-nums}
  .c.bad .v{color:var(--bad)} .c.ok .v{color:var(--ok)} .c.warn .v{color:var(--warn)}
  h2{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;
     margin:22px 0 9px;font-weight:600}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  th{text-align:left;color:var(--dim);font-weight:500;padding:6px 10px;
     border-bottom:1px solid var(--line2);white-space:nowrap}
  td{padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
  tr:hover td{background:#1a212b}
  .tag{font-size:10.5px;padding:1px 6px;border-radius:10px;border:1px solid var(--line2);color:var(--dim)}
  .steps{display:flex;flex-direction:column;gap:2px;max-width:560px}
  .steprow{display:flex;align-items:baseline;gap:6px;line-height:1.7}
  .good{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)} .dim{color:var(--dim)}
  .rule{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)}
  .rule .st{min-width:42px;font-weight:700}
  .rule .nm{flex:1}
  .rule .dt{color:var(--dim);font-size:11.5px}
  .viol{margin:4px 0 8px 52px;color:#f0a9a4;font-size:11.5px}
  .viol div{padding:1px 0}
  .banner{background:#2b2209;border:1px solid #6b5412;color:#f0d68a;border-radius:7px;
          padding:9px 13px;margin-bottom:14px;font-size:12px}
  .empty{color:var(--dim);padding:24px 0}
  button.act{background:var(--card);color:var(--ink);border:1px solid var(--line2);
             border-radius:6px;padding:5px 12px;font:inherit;font-size:12px;cursor:pointer}
  button.act:hover{border-color:var(--accent)}
  .wrap{overflow-x:auto}
  /* Client cards. A roster you scan, not a spreadsheet you parse. */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
  .cc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 15px;
      cursor:pointer;transition:border-color .12s,transform .12s}
  .cc:hover{border-color:var(--accent);transform:translateY(-1px)}
  .cc.open{border-color:var(--accent)}
  .cc .nm{font-size:13.5px;font-weight:600;margin-bottom:2px;white-space:nowrap;
          overflow:hidden;text-overflow:ellipsis}
  .cc .sub{color:var(--dim);font-size:11px;margin-bottom:10px}
  .cc .big{font-size:26px;font-variant-numeric:tabular-nums;line-height:1}
  .cc .big small{font-size:12px;color:var(--dim);font-weight:400}
  .cc .foot{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:11px;color:var(--dim);
            flex-wrap:wrap}
  .bar{height:4px;border-radius:3px;background:var(--line2);overflow:hidden;margin-top:9px}
  .bar i{display:block;height:100%;background:var(--ok)}
  .bar i.short{background:var(--warn)} .bar i.over{background:var(--bad)}
  .chip{font-size:10.5px;padding:1px 7px;border-radius:9px;border:1px solid var(--line2)}
  .chip.ok{color:var(--ok);border-color:#1d4429} .chip.warn{color:var(--warn);border-color:#5a4512}
  .chip.bad{color:var(--bad);border-color:#5e2626}
  .panel{grid-column:1/-1;background:#12171e;border:1px solid var(--line2);border-radius:10px;
         padding:16px 18px;margin-top:-2px}
  .panel h3{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;
            margin:16px 0 8px;font-weight:600}
  .panel h3:first-child{margin-top:0}
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
  .fact .k{color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
  .fact .v{font-size:15px;margin-top:3px;font-variant-numeric:tabular-nums}
  .mono{font:inherit;font-size:11.5px;color:var(--dim);line-height:1.7;word-break:break-all}
  /* Burned domains, grouped — the old health tab's view, which is how the
     decision is actually made: Zapmail bills by whole domain. */
  .dcard{background:var(--card);border:1px solid var(--line);border-radius:8px;
         padding:11px 13px;margin-bottom:9px}
  .dcard.d3{border-color:#5e2626} .dcard.d2{border-color:#5a4512}
  .dhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .dhead b{font-size:12.5px}
  .dratio{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
  .drow{display:flex;gap:8px;padding:3px 0;font-size:11.5px;align-items:center}
  .drow .em{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dnote{margin:6px 0;padding:7px 10px;border-radius:6px;font-size:11.5px;
         background:#2b2209;border:1px solid #6b5412;color:#f0d68a}
  .dacts{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
  .dmsg{margin-top:6px;font-size:11.5px;color:var(--dim)}
  button.act:disabled{opacity:.45;cursor:not-allowed;border-color:var(--line)}
</style>
</head>
<body>
<div class="top">
  <div class="ttl">
    <h1>Sending infrastructure</h1>
    <span class="meta" id="meta">loading…</span>
    <span style="flex:1"></span>
    <button class="act" id="reload">Reload</button>
  </div>
  <nav>
    <button data-t="overview" class="on">Overview</button>
    <button data-t="clients">Clients</button>
    <button data-t="onboarding">Onboarding</button>
    <button data-t="inboxes">Inboxes</button>
    <button data-t="acquisition">Acquisition</button>
    <button data-t="buy">Buy</button>
    <button data-t="pools">Pools</button>
  </nav>
</div>
<main>
  <div id="banners"></div>
  <div id="overview"></div>
  <div id="clients" hidden></div>
  <div id="onboarding" hidden></div>
  <div id="inboxes" hidden></div>
  <div id="acquisition" hidden></div>
  <div id="buy" hidden></div>
  <div id="pools" hidden></div>
</main>
<script>
// ── auth ────────────────────────────────────────────────────────────────
// The password lives in a cookie, set once, exactly like the existing
// dashboard. A ?pw= in the URL is accepted, immediately stored, and then
// STRIPPED from the address bar — a password in a URL survives in browser
// history, in screenshots, and in any link that gets forwarded.
function cookie(name){
  const m = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
  return m ? m[2] : '';
}
function setPw(v){
  document.cookie = 'dashboard_pw=' + encodeURIComponent(v) + ';path=/;max-age=31536000;samesite=lax';
}
(function absorbUrlPw(){
  const u = new URL(location.href);
  const p = u.searchParams.get('pw');
  if (p) {
    setPw(p);
    u.searchParams.delete('pw');
    history.replaceState(null, '', u.pathname + (u.search || '') + u.hash);
  }
})();
// Every fetch is bounded. Without this a request that never settles leaves the
// page on "loading…" for ever with nothing on screen saying why — which is
// exactly what a slow endpoint behind Vercel's 300s limit looks like from here.
const FETCH_TIMEOUT_MS = 120000;

async function api(path){
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), FETCH_TIMEOUT_MS);
  let r;
  try {
    r = await fetch(path, {credentials: 'same-origin', signal: ctl.signal});
  } catch (e) {
    return {error: e.name === 'AbortError'
      ? `${path} took longer than ${FETCH_TIMEOUT_MS / 1000}s and was given up on`
      : `${path} failed: ${e.message}`};
  } finally {
    clearTimeout(timer);
  }
  if (r.status === 401) {
    const p = prompt('Dashboard password:');
    if (p) { setPw(p); location.reload(); }
    return {error: 'not signed in'};
  }
  const j = await r.json().catch(() => ({error: 'bad JSON from ' + path}));
  return r.ok ? j : {error: j.error || ('HTTP ' + r.status)};
}
async function post(path, body){
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), FETCH_TIMEOUT_MS);
  let r;
  try {
    r = await fetch(path, {method: 'POST', credentials: 'same-origin', signal: ctl.signal,
      headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
  } catch (e) {
    // A POST that times out may still have LANDED — say so rather than implying
    // nothing happened, because the next click could repeat a paid action.
    // A timeout is NOT a failure verdict — the work may be mid-flight on the
    // server. Flag it so callers that poll a resumable job can keep waiting
    // instead of reporting an error the server never gave.
    if (e.name === 'AbortError') {
      return {timedOut: true,
              error: `${path} took longer than ${FETCH_TIMEOUT_MS / 1000}s. It may still have `
                   + `gone through — reload and check before trying again.`};
    }
    return {error: `${path} failed: ${e.message}`};
  } finally {
    clearTimeout(timer);
  }
  if (r.status === 401) {
    // A POST is an ACTION the user just chose. Reloading here throws that away
    // and drops them back on a fresh page, which reads as "the button did
    // nothing" — they click again and nothing happens again. Re-auth in place
    // and tell them to repeat the click, instead of wiping the page.
    const p = prompt('Signed out. Dashboard password to continue:');
    if (p) { setPw(p); return {error: 'signed back in — click again to run this.'}; }
    return {error: 'not signed in — nothing was changed.'};
  }
  const j = await r.json().catch(() => ({error: 'bad JSON from ' + path}));
  return r.ok ? j : {error: j.error || ('HTTP ' + r.status), refused: j.refused};
}
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const money = n => '$' + Number(n || 0).toLocaleString();

function ago(s){
  if (s == null) return 'age unknown';
  if (s < 90) return s + 's ago';
  if (s < 5400) return Math.round(s/60) + 'm ago';
  if (s < 172800) return (s/3600).toFixed(1) + 'h ago';
  return Math.round(s/86400) + 'd ago';
}

let DATA = {};

const get = api;

function card(k, v, cls){ return `<div class="c ${cls||''}"><div class="k">${k}</div><div class="v">${v}</div></div>`; }

function renderOverview(){
  const inv = DATA.invariants || {}, cl = DATA.clients || {};
  const s = cl.summary || {}, c = inv.counts || {};
  const el = document.getElementById('overview');
  if (inv.error && cl.error) { el.innerHTML = `<div class="empty">Both feeds failed: ${esc(inv.error)}</div>`; return; }

  let html = '<div class="cards">'
    + card('Rules failing', c.FAIL ?? '–', c.FAIL ? 'bad' : 'ok')
    + card('Active clients', s.active_clients ?? '–')
    + card('Client inboxes', s.inboxes ?? '–')
    + card('Monthly cost', s.monthly_cost != null ? money(s.monthly_cost) : '–')
    + card('Off target', s.off_target ?? '–', s.off_target ? 'warn' : 'ok')
    + card('Decisions ≤30d', s.decisions_due_30d ?? '–', s.decisions_due_30d ? 'warn' : '')
    + card('Needs replacing', (DATA.inboxes || {}).summary?.actionable_burned ?? '–',
           (DATA.inboxes || {}).summary?.actionable_burned ? 'bad' : 'ok')
    + card('Onboarding owed', (() => {
        const o = (DATA.onboarding || {}).summary || {};
        return o.needs_work != null ? o.needs_work : '–';
      })(), ((DATA.onboarding || {}).summary || {}).needs_work ? 'warn' : 'ok')
    + card('Acq. free', (() => {
        const a = (DATA.acquisition || {}).summary || {};
        return a.free_inboxes != null ? a.free_inboxes : '?';
      })(), 'warn')
    + '</div>';

  html += `<h2>The rules</h2>
    <div class="meta" style="margin:-4px 0 10px">
      <b>FAIL</b> means the rule was checked and broken. <b>SKIP</b> means it could not be
      checked at all — treat that as unknown, never as fine. A <b>Fix</b> button appears only
      where the repair is a fixed script; everything else needs a decision about which value
      is right or whether to spend, and it re-checks against live data before touching anything.
    </div>`;
  if (inv.error) {
    html += `<div class="empty">${esc(inv.error)}</div>`;
  } else {
    // A Fix button only where a fix EXISTS as a script. Everything else needs a
    // decision — which value is right, whether to spend — and a button that
    // pretends otherwise is worse than no button.
    const FIXABLE = {
      7: 'Turn auto-renew off',
      10: 'Remove from SmartLead',
    };
    html += (inv.results || []).map(r => `
      <div class="rule">
        <span class="st ${r.status === 'PASS' ? 'good' : r.status === 'FAIL' ? 'bad' : 'warn'}">${r.status}</span>
        <span class="nm">${esc(r.name)}</span>
        <span class="dt">${esc(r.detail || '')}</span>
        ${r.status === 'FAIL' && FIXABLE[r.rule]
          ? `<button class="act" data-fix="${r.rule}">${FIXABLE[r.rule]}</button>` : ''}
      </div>
      ${(r.violations || []).length ? '<div class="viol">'
        + r.violations.slice(0, 6).map(v => `<div>${esc(v)}</div>`).join('')
        + (r.violation_count > 6 ? `<div class="dim">…and ${r.violation_count - 6} more</div>` : '')
        + '</div>' : ''}
      <div class="dmsg" id="fix-${r.rule}"></div>`).join('');
  }
  el.innerHTML = html;
  wireRuleFixes();
}

// Every fix DRY-RUNS first and shows exactly what it would touch, then asks.
// The server re-derives its own target list from live data rather than trusting
// the stored rule result, which can be hours old.
function wireRuleFixes(){
  document.querySelectorAll('button[data-fix]').forEach(b => b.onclick = async () => {
    const rule = +b.dataset.fix;
    const out = document.getElementById('fix-' + rule);
    b.disabled = true; out.textContent = 'checking…';
    const dry = await post('/api/rule-fix', {rule});
    if (dry.error) { out.innerHTML = `<span class="bad">${esc(dry.error)}</span>`; b.disabled = false; return; }
    if (!dry.count) {
      // A refusal is NOT "nothing to do". `blocked_by` means the fix stopped
      // because a safety check could not run — painting that green is how a
      // guard that is protecting you gets read as a guard that found nothing.
      const cls = dry.blocked_by ? 'warn' : 'good';
      out.innerHTML = `<span class="${cls}">${esc(dry.note || 'nothing to do')}</span>`;
      b.disabled = false; return;
    }
    const held = (dry.held || []).length
      ? `\n\n${dry.held.length} held back (${dry.held_reason}) and will NOT be touched.` : '';
    // Rule 7: domains that look empty but are actively sending from outside
    // Zapmail. Showing the count is the difference between an informed click
    // and lapsing a domain with live senders on it.
    const ext = (dry.kept_external || []).length
      ? `\n\n${dry.kept_external.length} skipped — no Zapmail mailbox but still `
        + `sending from Smartlead.` : '';
    const scan = dry.reply_scan ? `\n\nPositive-reply scan: ${dry.reply_scan}.` : '';
    const money = dry.saving_yr ? `\n\nSaves about $${dry.saving_yr}/yr.` : '';
    const preview = dry.targets.slice(0, 15).join('\n   ')
      + (dry.targets.length > 15 ? `\n   …and ${dry.targets.length - 15} more` : '');
    if (!confirm(`${b.textContent} for ${dry.count} item(s)?\n\n   ${preview}${held}${ext}${scan}${money}`)) {
      out.textContent = ''; b.disabled = false; return;
    }
    out.textContent = 'working…';
    const res = await post('/api/rule-fix', {rule, confirm: true});
    out.innerHTML = res.error
      ? `<span class="bad">${esc(res.error)}</span>`
      : `<span class="good">done — ${res.deleted ?? res.disabled ?? 0} changed${
          (res.failed || []).length ? `, ${res.failed.length} failed` : ''}</span>`;
    b.disabled = false;
  });
}

function renderClients(){
  const d = DATA.clients || {};
  const el = document.getElementById('clients');
  if (d.error) { el.innerHTML = `<div class="empty">${esc(d.error)}</div>`; return; }
  const rows = d.clients || [];
  const s = d.summary || {};

  let html = '<div class="cards">'
    + card('Active clients', s.active_clients ?? '\u2013')
    + card('Client inboxes', s.inboxes ?? '\u2013')
    + card('Monthly cost', s.monthly_cost != null ? money(s.monthly_cost) : '\u2013')
    + card('Off target', s.off_target ?? '\u2013', s.off_target ? 'warn' : 'ok')
    + card('Decisions \u226430d', s.decisions_due_30d ?? '\u2013', s.decisions_due_30d ? 'warn' : '')
    + '</div>';

  html += `<h2>Clients \u2014 ${rows.length}</h2><div class="grid" id="cgrid">`;
  rows.forEach((c, i) => {
    const held = c.inboxes || 0, tgt = c.target;
    const pct = tgt ? Math.min(100, Math.round(100 * held / tgt)) : 100;
    const cls = !tgt ? '' : held < tgt ? 'short' : held > tgt ? 'over' : '';
    const days = c.days_to_decision;
    const when = c.exempt ? '<span class="chip">free</span>'
      : c.decide_by
        ? `<span class="chip ${days != null && days <= 30 ? 'warn' : ''}">decide ${esc(c.decide_by)}</span>`
        : '<span class="chip">no date</span>';
    html += `<div class="cc" data-i="${i}" data-name="${esc(c.name)}">
        <div class="nm" title="${esc(c.name)}">${esc(c.name)}</div>
        <div class="sub">${esc(c.billing_model || '')}${c.seasonal ? ' \u00b7 seasonal' : ''}</div>
        <div class="big">${held}${tgt ? ` <small>/ ${tgt}</small>` : ''}</div>
        <div class="bar"><i class="${cls}" style="width:${pct}%"></i></div>
        <div class="foot">
          <span>${c.monthly_cost != null ? money(c.monthly_cost) + '/mo' : ''}</span>
          ${when}
          <span class="chip" data-warm="${esc(c.name)}" hidden></span>
          ${c.term_is_a_guess ? '<span class="chip warn">term assumed</span>' : ''}
        </div>
      </div>`;
  });
  html += '</div>';
  el.innerHTML = html;

  el.querySelectorAll('.cc').forEach(cardEl => {
    cardEl.onclick = () => openClient(cardEl, rows[+cardEl.dataset.i]);
  });
  // Cards are on screen; now fetch the detail for all of them in the
  // background so the first click does not wait. Once it lands, any client
  // with inboxes still warming gets a chip on its card face — that is the
  // thing you want to see without opening anything.
  prefetchClientDetail().then(() => {
    el.querySelectorAll('[data-warm]').forEach(chip => {
      const det = CDETAIL[cnorm(chip.dataset.warm)];
      const w = det && det.warmup;
      if (!w || !w.warming) return;
      chip.textContent = `${w.warming} warming`;
      chip.className = 'chip warn';
      chip.title = w.all_ready_on ? 'all ready on ' + w.all_ready_on : '';
      chip.hidden = false;
    });
  });
}

// Card detail.
//
// Every card used to fetch its own: the request re-walked Smartlead (29s),
// Zapmail (9s, twice) and the health table (4s) — about fifty seconds per
// click, and the same fifty again for the next card, because nothing was
// shared. None of those reads is per-client, so the server now builds all of
// them at once and caches it, and the page pulls that map ONCE in the
// background after the cards paint. Clicking a card is then instant.
const CDETAIL = {};
let CDETAIL_ALL = null;

function prefetchClientDetail(){
  if (CDETAIL_ALL) return CDETAIL_ALL;
  CDETAIL_ALL = get('/api/client-detail?all=1').then(r => {
    if (!r.error && r.clients) Object.assign(CDETAIL, r.clients);
    return r;
  }).catch(() => null);
  return CDETAIL_ALL;
}

const cnorm = s => String(s ?? '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();

async function openClient(cardEl, row){
  const grid = document.getElementById('cgrid');
  const existing = document.getElementById('cpanel');
  const same = existing && existing.dataset.name === row.name;
  if (existing) existing.remove();
  grid.querySelectorAll('.cc').forEach(x => x.classList.remove('open'));
  if (same) return;                       // second click closes it

  cardEl.classList.add('open');
  const panel = document.createElement('div');
  panel.className = 'panel'; panel.id = 'cpanel'; panel.dataset.name = row.name;
  panel.innerHTML = '<div class="empty">loading…</div>';
  panel.scrollIntoView({block: 'nearest', behavior: 'smooth'});
  // Insert after the last card in the same visual row so the panel opens
  // beneath the card you clicked rather than at the end of the grid.
  cardEl.insertAdjacentElement('afterend', panel);

  let det = CDETAIL[cnorm(row.name)] || CDETAIL[row.name];
  if (!det) {
    // The background pull has not landed yet — wait on it rather than firing a
    // second request for the same data.
    await prefetchClientDetail();
    det = CDETAIL[cnorm(row.name)] || CDETAIL[row.name];
  }
  if (!det) {
    det = await get('/api/client-detail?name=' + encodeURIComponent(row.name));
    if (!det.error) CDETAIL[cnorm(row.name)] = det;
  }
  if (det.error) { panel.innerHTML = `<div class="empty">${esc(det.error)}</div>`; return; }

  const doms = det.domains || {};
  const ded = doms.dedicated || [], sh = doms.shared || [], pool = doms.pool || [];
  const fact = (k, v) => `<div class="fact"><div class="k">${k}</div><div class="v">${v}</div></div>`;
  const dash = '<span class="dim">\u2014</span>';

  let h = `<div class="facts">
      ${fact('Inboxes', det.inbox_count ?? dash)}
      ${fact('Domains', det.domain_count ?? dash)}
      ${fact('Per month', det.monthly_cost != null ? money(det.monthly_cost) : dash)}
      ${fact('Per year', det.yearly_cost != null ? money(det.yearly_cost) : dash)}
      ${fact('Term ends', det.term_ends ? esc(det.term_ends) : dash)}
      ${fact('Decide by', det.decide_by
          ? `${esc(det.decide_by)}${det.days_to_decision != null
              ? ` <span class="dim" style="font-size:12px">(${det.days_to_decision}d)</span>` : ''}`
          : dash)}
      ${fact('Hard stop', det.hard_stop ? esc(det.hard_stop) : dash)}
      ${fact('Launched', det.launch_date ? esc(det.launch_date) : dash)}
    </div>`;

  if (det.term_basis)
    h += `<div class="meta" style="margin-top:10px">Term basis: ${esc(det.term_basis)}${
      det.website ? ' \u00b7 forwards to ' + esc(det.website) : ''}</div>`;

  h += `<h3>Domains \u2014 ${det.domain_count ?? 0}</h3>`;
  if (ded.length) h += `<div class="mono">${ded.map(esc).join(' \u00b7 ')}</div>`;
  if (sh.length) h += `<h3>Shared with another client \u2014 ${sh.length}</h3>
    <div class="mono">${sh.map(esc).join(' \u00b7 ')}</div>
    <div class="meta">A shared domain forwards to one place only, so its senders
      can point at the wrong company.</div>`;
  if (pool.length) h += `<h3>From a pool \u2014 ${pool.length}</h3>
    <div class="mono">${pool.map(esc).join(' \u00b7 ')}</div>`;

  const w = det.warmup;
  if (w) {
    // Per inbox, from its own creation date. One number for a whole group is
    // what hid McFarlane's 15 still-warming inboxes behind 27 finished ones.
    h += `<h3>Warm-up</h3><div class="facts">
      ${fact('Ready to send', `<span class="${w.ready ? 'good' : 'dim'}">${w.ready}</span>`)}
      ${fact('Still warming', `<span class="${w.warming ? 'warn' : 'dim'}">${w.warming}</span>`)}
      ${w.unknown ? fact('No date', `<span class="warn">${w.unknown}</span>`) : ''}
      ${w.all_ready_on ? fact('All ready on', esc(w.all_ready_on)) : ''}
    </div>`;
    if (w.warming)
      h += `<div class="meta" style="margin-top:8px">Only the ready ones can go into a campaign.
        Warm-up is 14 days from each inbox's own creation date \u2014 a batch bought on two
        different days finishes on two different days.</div>`;
  }

  h += `<h3>Inboxes \u2014 ${det.inbox_count ?? 0}</h3>`;
  if (det.inboxes_unreadable) {
    h += `<div class="banner">The inbox list could not be read, so it is not shown.
      That is not the same as this client having none \u2014 the count above says
      ${det.inbox_count}.</div>`;
  } else if (!(det.inboxes || []).length) {
    h += '<div class="empty">No inboxes found for this client.</div>';
  } else {
    const bad = det.inboxes.filter(i => i.health === 'burned');
    if (bad.length) h += `<div class="banner">${bad.length} burned \u2014 replace from the Inboxes tab.</div>`;
    h += `<div class="wrap"><table>
      <tr><th>Inbox</th><th>Domain</th><th>Created</th><th>Warm-up</th><th>Health</th></tr>
      ${det.inboxes.map(i => {
        const wu = i.ready === true
          ? '<span class="good">ready</span>'
          : i.ready === false
            ? `<span class="warn">day ${i.age_days}/14</span> <span class="dim">\u2192 ${esc(i.ready_on || '')}</span>`
            : '<span class="dim">unknown</span>';
        return `<tr><td>${esc(i.email)}</td><td class="dim">${esc(i.domain || '')}</td>
        <td class="dim">${esc(i.created || '')}</td><td>${wu}</td>
        <td class="${i.health === 'burned' ? 'bad' : i.health === 'at_risk' ? 'warn' : 'dim'}">${esc(i.health || '')}</td>
      </tr>`; }).join('')}</table></div>`;
  }

  if ((det.cohorts || []).length > 1)
    h += `<h3>Billing cohorts \u2014 ${det.cohorts.length}</h3>
      <div class="meta">Bought on different days, so they bill on different days.</div>
      <div class="wrap"><table>
        <tr><th>Created</th><th>Inboxes</th><th>$/mo</th><th>Next bill</th><th>Hard stop</th></tr>
        ${det.cohorts.map(c => `<tr><td>${esc(c.created)}</td><td class="n">${c.mailboxes}</td>
          <td class="n dim">${money(c.monthly_cost)}</td><td>${esc(c.next_bill || '')}</td>
          <td>${esc(c.hard_stop || '')}</td></tr>`).join('')}
      </table></div>`;

  panel.innerHTML = h;
}

function renderOnboarding(){
  const d = DATA.onboarding || {};
  const el = document.getElementById('onboarding');
  if (d.error) { el.innerHTML = `<div class="empty">${esc(d.error)}</div>`; return; }
  const s = d.summary || {};

  let html = '<div class="cards">'
    + card('Fully onboarded', `${s.complete ?? 0} <span class="dim" style="font-size:13px">of ${s.active_clients ?? 0}</span>`,
           s.needs_work ? '' : 'ok')
    + card('Needs work', s.needs_work ?? '\u2013', s.needs_work ? 'warn' : 'ok')
    + card('No infra at all', s.no_infra ?? '\u2013', s.no_infra ? 'bad' : 'ok')
    + card('Below target', s.below_target ?? '\u2013', s.below_target ? 'warn' : 'ok')
    + card('Forwarding wrong', s.bad_forwarding ?? '\u2013', s.bad_forwarding ? 'bad' : 'ok')
    + card('Inboxes to buy', s.inboxes_to_buy ?? '\u2013', s.inboxes_to_buy ? 'warn' : 'ok')
    + '</div>';

  if (s.forwarding_checked === false)
    html += `<div class="banner">Zapmail could not be read, so forwarding was not checked on
      anyone. Nothing below is a clean bill of health.</div>`;

  html += `<h2>Owed to a live client \u2014 ${(d.queue || []).length}</h2>`;
  if (!(d.queue || []).length) {
    html += '<div class="empty">Every active client in the CRM has its infrastructure, '
          + 'at target, forwarding to its own website.</div>';
  } else {
    html += `<div class="wrap"><table>
      <tr><th>Client</th><th>Blocked on</th><th>Inboxes</th><th>Short</th><th>What is missing</th><th></th></tr>
      ${d.queue.map(e => {
        const lbl = (d.step_labels || {})[e.blocking] || e.blocking || '';
        const tab = STEP_TAB[e.blocking];
        const go = tab ? `<button class="act" data-goto="${tab}">Go to ${tab}</button>` : '';
        return `<tr>
          <td>${esc(e.client)}</td>
          <td class="${e.blocking === 'infra' || e.blocking === 'forwarding' ? 'bad' : 'warn'}">${esc(lbl)}</td>
          <td class="n">${e.inboxes}<span class="dim">/${e.target}</span></td>
          <td class="n">${e.short || ''}</td>
          <td class="dim">${(e.notes || []).map(esc).join('<br>')}</td>
          <td>${go}</td></tr>`;
      }).join('')}
    </table></div>
    <div class="meta" style="margin-top:10px">Order matters: a client with no inboxes is not also
      reported for forwarding. Nothing on this tab changes anything \u2014 it is the list, not the fix.</div>`;
  }

  if ((d.complete || []).length)
    html += `<h2>Fully onboarded \u2014 ${d.complete.length}</h2>
      <div class="meta">${d.complete.map(esc).join(' \u00b7 ')}</div>`;

  el.innerHTML = html;
  el.querySelectorAll('button[data-goto]').forEach(b => b.onclick = () => {
    const t = b.dataset.goto;
    document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x.dataset.t === t));
    ['overview','clients','onboarding','inboxes','acquisition','buy','pools'].forEach(n =>
      document.getElementById(n).hidden = (n !== t));
    showTab(t);
  });
}

function renderInboxes(){
  const d = DATA.inboxes || {};
  const el = document.getElementById('inboxes');
  if (d.error) { el.innerHTML = `<div class="empty">${esc(d.error)}</div>`; return; }
  if (d.loading) { el.innerHTML = '<div class="empty">Health cache is empty — run the sync.</div>'; return; }
  const s = d.summary || {}, c = d.counts || {};
  const need = s.needed_by_vertical || {};
  const shortService = (need.service || 0) > 0 && !(s.service_reserve > 0);

  const b = d.burn_rate || {}, bs = b.summary || {};
  const rate = bs.per_week, runway = bs.runway_weeks;

  let html = '<div class="cards">'
    + card('Needs replacing', s.actionable_burned ?? '–', s.actionable_burned ? 'bad' : 'ok')
    + card('Burn rate', b.measured ? `${rate}<span class="dim" style="font-size:13px">/wk</span>` : '?',
           !b.measured ? 'warn' : rate >= 5 ? 'bad' : rate > 0 ? 'warn' : 'ok')
    + card('Replacement pool', s.replacement ?? '–', (s.replacement ?? 0) ? '' : 'bad')
    + card('Runway', runway != null ? `${runway}<span class="dim" style="font-size:13px"> wk</span>`
                                    : (b.measured ? 'n/a' : '?'),
           runway == null ? '' : runway < 4 ? 'bad' : runway < 12 ? 'warn' : 'ok')
    + card('At risk', bs.at_risk ?? '–', (bs.at_risk ?? 0) > 200 ? 'warn' : '')
    + card('Burned total', s.burned ?? '–')
    + card('Reserve', s.reserve ?? '–')
    + card('Fleet', s.inboxes ?? '–')
    + '</div>';

  if (!b.measured)
    html += `<div class="banner">${esc(b.reason || 'Burn rate could not be computed')} —
      the rate is withheld rather than shown low. A rate built from a short read always
      looks healthy.</div>`;
  else if (b.window_complete === false)
    html += `<div class="banner">The window reaches back before ${esc(b.history_from)}, which is
      the earliest date health history is true. Crossings before then are missing, so this
      rate is a floor, not the real number.</div>`;

  if (b.measured && (b.weeks || []).length) {
    const mx = Math.max(1, ...b.weeks.map(w => w.new_burns));
    html += '<h2>New burns by week</h2><div class="wrap"><table>'
      + '<tr><th>Week</th><th>New burns</th><th style="width:55%"></th></tr>'
      + b.weeks.map(w => `<tr><td class="dim">${esc(w.from)}</td>
          <td class="n">${w.new_burns}</td>
          <td><span style="display:inline-block;height:9px;border-radius:2px;
            background:${w.new_burns >= 5 ? 'var(--bad)' : 'var(--warn)'};
            width:${Math.round(100 * w.new_burns / mx)}%"></span></td></tr>`).join('')
      + '</table></div>'
      + `<div class="meta" style="margin-top:8px">New burns are inboxes that were not burned
         at the previous snapshot — net change would let a cancelled inbox cancel out a
         genuinely new one.
         ${runway != null
            ? `At ${rate}/week the ${bs.replacement_pool} in the Replacement Group cover ${runway} weeks.`
            : 'Nothing is burning, so there is no runway to quote — that is not a reason to shrink the pool.'}</div>`;
  }

  if (shortService)
    html += `<div class="banner">${need.service} burned service inbox(es) and no service reserve to
      replace them from. Every reserve domain is landscaping — leave them in place rather than
      moving a service client onto a lawn-care domain.</div>`;

  html += '<h2>Health</h2><div class="wrap"><table><tr>'
    + ['healthy','watch','at_risk','burned','warming','idle','insufficient']
        .map(k => `<th>${k.replace('_',' ')}</th>`).join('')
    + '</tr><tr>'
    + ['healthy','watch','at_risk','burned','warming','idle','insufficient']
        .map(k => `<td class="n">${c[k] ?? 0}</td>`).join('')
    + '</tr></table></div>';

  const act = (d.burned || []).filter(b => b.actionable);
  const dead = (d.burned || []).filter(b => !b.actionable);

  // The replacement loop, same as the old health tab ran it and in the same
  // order, because the order is the safety:
  //   1 check positives — a reply lives in the mailbox that sent it and is
  //     welded to it by message-id, so detaching freezes the conversation
  //   2 flag for replacement — pulls a niche-matched reserve inbox
  //   3 swap
  //   4 schedule the Zapmail removal, so we stop paying on the billing date
  // Nothing here skips step 1. That is the whole reason the old flow was safe.
  // ── Burned domains, grouped. Ported from the old health tab because that
  // is the unit the decision is made in: one burned inbox on a domain is a
  // replacement, three is a cancellation, and Zapmail bills the whole domain
  // either way.
  const dv = d.domain_view || {};
  const dsum = dv.summary || {};
  if (dv.error) {
    html += `<h2>Burned domains</h2><div class="banner">${esc(dv.error)}</div>`;
  } else if ((dv.domains || []).length) {
    html += `<h2 class="bad">Burned domains — reallocate &amp; cancel</h2>
      <div class="meta" style="margin-bottom:10px">
        ${dsum.domains ?? 0} domains · ${dsum.burned_mailboxes ?? 0} burned mailboxes ·
        ${dsum.fully_dead ?? 0} fully dead · ${dsum.cancelable_now ?? 0} clean to cancel ·
        ${dsum.already_scheduled ?? 0} already scheduled.
        Inboxes burned (bounce ≥3% and reply ≤0.5%) while actively sending, grouped by domain.
      </div>`;
    html += dv.domains.map(x => {
      const c = x.counts || {};
      const cls = c.burned >= 3 ? 'd3' : c.burned === 2 ? 'd2' : '';
      const col = c.burned >= 3 ? 'var(--bad)' : c.burned === 2 ? 'var(--warn)' : 'var(--warn)';
      const rows = (x.burned_mailboxes || []).map(m => {
        const where = m.in_campaign ? ''
          : (m.idle ? ' · <span class="dim">idle (paused/completed campaign)</span>'
                    : ' · <span class="dim">not in campaign</span>');
        const job = m.has_job ? ' · <span class="good">reallocated</span>' : '';
        return `<div class="drow"><span class="bad">✖</span>
          <span class="em">${esc(m.email)}</span>
          <span class="dim">b ${m.bounce_3d == null ? '—' : m.bounce_3d + '%'} ·
            r ${m.reply_3d == null ? '—' : m.reply_3d + '%'}${job}${where}</span></div>`;
      }).join('');
      const collat = (c.collateral
        ? `<div class="dnote">⚠ ${c.collateral} healthy inbox(es) actively sending on this
             domain would ALSO be deleted on cancel:
             ${(x.collateral || []).map(y => esc(y.email)).join(', ')}. Replace them first.</div>`
        : '');
      const needR = (x.need_reallocate || []).length;
      const reBtn = needR
        ? (x.reserve_ok
            ? `<button class="act" data-dreal="${esc(x.domain)}">Reallocate ${needR} burned</button>`
            : `<button class="act" disabled title="compatible reserve: ${x.reserve_pool}">Reallocate ${needR} — reserve ${x.reserve_pool} (warm more)</button>`)
        : `<span class="dim good">✓ ${(x.burned_mailboxes || []).some(m => m.idle || !m.in_campaign)
             ? 'burned but not sending — cancel directly' : 'burned already reallocated'}</span>`;
      const canBtn = x.scheduled
        ? '<span class="dim">⏳ scheduled for removal</span>'
        : `<button class="act" data-dcancel="${esc(x.domain)}">Cancel domain${x.clean_cancel ? '' : ' ⚠'}</button>`;
      return `<div class="dcard ${cls}">
        <div class="dhead">
          <b>${esc(x.domain)}</b>
          <span class="chip">${esc(x.niche || '')}</span>
          <span class="dim">${esc(x.source || '')}${(x.clients || []).length && x.source === 'client'
            ? ' · ' + x.clients.map(esc).join(', ') : ''}</span>
          <span class="dratio" style="color:${col}">${c.burned}/${x.total} burned</span>
        </div>
        <div style="margin-top:5px">${rows}</div>
        ${collat}
        <div class="dacts">${reBtn} ${canBtn}</div>
        <div class="dmsg" id="dm-${esc(x.domain).replace(/[^a-z0-9]/gi, '-')}"></div>
      </div>`;
    }).join('');
  } else {
    html += '<h2>Burned domains</h2><div class="empty">No burned domains.</div>';
  }

  // A frozen burned list looks exactly like a quiet week. If the health feed
  // has stopped, say so ABOVE the list, because the number below it is the
  // thing that will otherwise be trusted.
  const fr = d.freshness || {};
  if (fr.stale) {
    html += `<div class="banner bad">⚠ This list may be incomplete —
      ${esc(fr.reason || 'health data freshness could not be established')}
      ${fr.latest ? `<span class="dim">Newest health data: ${esc(fr.latest)}.</span>` : ''}
      </div>`;
  }
  html += `<h2>Burned on a live client — ${act.length}${
    fr.stale ? ' <span class="warn" style="font-size:.8em">(as of '
             + esc(fr.latest || 'unknown') + ')</span>' : ''}</h2>`;
  if (!act.length) {
    html += '<div class="empty">Nothing burned on a live client.</div>';
  } else {
    const rs = d.reserve_by_niche || {};
    const avail = rs.available_by_niche || {};
    html += `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center">
        <button class="act" id="rp-check">1 · Check replies</button>
        <button class="act" id="rp-realloc" disabled>2 · Reallocate now</button>
        <button class="act" id="rp-flag" disabled>2b · Flag &amp; warm instead</button>
        <button class="act" id="rp-cancel" disabled>3 · Schedule Zapmail removal</button>
        <span class="dim" id="rp-sel">0 selected</span>
        <span style="flex:1"></span>
        <button class="act" id="rp-all">Select all</button>
      </div>
      <div class="meta" style="margin:-4px 0 10px">Reserve ready:
        ${Object.entries(avail).map(([k, v]) =>
          `<span class="chip ${v ? 'ok' : 'bad'}">${esc(k)} ${v}</span>`).join(' ')}
        \u00b7 <b>Reallocate now</b> swaps a ready reserve inbox straight into the campaign.
        <b>Flag &amp; warm</b> is for when no matching reserve exists \u2014 it claims one and
        warms it for 14 days first.</div>
      <div id="rp-out"></div>
      <div class="wrap"><table>
      <tr><th style="width:28px"></th><th>Inbox</th><th>Client</th><th>Domain type</th>
          <th>Bounce 3d</th><th>Reply 3d</th><th>Positives</th><th>Why</th></tr>
      ${act.map(b => `<tr><td><input type="checkbox" class="rp" data-e="${esc(b.email)}"></td>
        <td>${esc(b.email)}</td><td>${esc(b.client)}</td>
        <td><span class="tag">${esc(b.vertical)}</span></td>
        <td class="n bad">${b.bounce_3d ?? ''}</td><td class="n dim">${b.reply_3d ?? ''}</td>
        <td class="n" id="pos-${esc(b.email)}"><span class="dim">?</span></td>
        <td class="dim">${esc(b.reason || '')}</td></tr>`).join('')}
    </table></div>
    <div class="meta" style="margin-top:10px">Step 1 is read-only and answers what would be
      held. A burned inbox that owns a positive reply is kept in its campaign on purpose —
      the replacement still goes in, so the campaign gets its capacity back. After a swap,
      hit <b>Reallocate Mailboxes</b> on the campaign in SmartLead; there is no API for that step.</div>`;
  }

  // The step SmartLead gives no API for. A swap is not finished until someone
  // clicks Reallocate on the campaign, and until then it is sending from a set
  // of mailboxes that no longer matches what is tagged.
  const rq = (d.reallocate_queue || {}).campaigns || [];
  if (rq.length)
    html += `<h2 class="warn">Waiting on a manual Reallocate in SmartLead \u2014 ${rq.length}</h2>
      <div class="wrap"><table>
        <tr><th>Campaign</th><th>Status</th><th></th></tr>
        ${rq.map(c => `<tr>
          <td>${c.url ? `<a href="${esc(c.url)}" target="_blank" rel="noopener"
                 style="color:var(--accent)">${esc(c.name)}</a>` : esc(c.name)}</td>
          <td class="${c.status === 'ACTIVE' ? 'good' : 'dim'}">${esc(c.status || '')}</td>
          <td><button class="act" data-realdone="${esc(c.name)}">Done \u2014 tick off</button></td>
        </tr>`).join('')}
      </table></div>
      <div class="meta" style="margin-top:8px">Open the campaign, hit <b>Reallocate mailboxes</b>,
        then tick it off here. Only ACTIVE campaigns are listed \u2014 reallocating a paused one
        does nothing.</div>`;

  if ((d.holds || []).length)
    html += `<h2>Held — owns a positive reply — ${d.holds.length}</h2>
      <div class="wrap"><table>
        <tr><th>Inbox</th><th>Campaign</th><th>Threads</th><th></th></tr>
        ${d.holds.map(h => `<tr><td>${esc(h.email)}</td><td class="dim">${esc(h.campaign_name || '')}</td>
          <td class="n">${h.positive_threads ?? (h.threads || []).length}</td>
          <td><button class="act" data-keep="${esc(h.key)}">Worked it — keep</button>
              <button class="act" data-rel="${esc(h.key)}">Worked it — detach</button></td></tr>`).join('')}
      </table></div>
      <div class="meta" style="margin-top:10px">Work the conversation first. Detaching freezes it:
        SmartLead's Reallocate only moves the unsent queue and can never move an existing thread.</div>`;

  if ((d.jobs || []).length)
    html += `<h2>Replacements in flight — ${d.jobs.length}</h2>
      <div class="wrap"><table>
        <tr><th>Burned inbox</th><th>Client</th><th>Replacement</th><th>Stage</th><th>Ready</th><th></th></tr>
        ${d.jobs.map(j => `<tr><td>${esc(j.email || '')}</td>
          <td class="dim">${esc(j.client || '')}</td>
          <td class="dim">${esc(j.replacement || '—')}</td>
          <td class="${j.stage === 'reserved' ? 'warn' : 'dim'}">${esc(j.stage || '')}</td>
          <td class="n dim">${j.ready ? '<span class="good">yes</span>'
                                       : (j.days_left != null ? j.days_left + 'd' : '—')}</td>
          <td>${j.ready ? `<button class="act" data-adv="${j.id}" data-act="swap">Swap in</button>`
                        : '<span class="dim">still warming</span>'}</td></tr>`).join('')}
      </table></div>
      <div class="meta" style="margin-top:8px">Only jobs still needing something are listed —
        swapped and cancelled ones are history. A replacement warms for 14 days before it can go in.</div>`;

  if (dead.length)
    html += `<h2>Burned but already cancelled — ${dead.length}</h2>
      <div class="meta">No action: these sit in a cleanup bucket and disappear on their billing date.</div>`;
  el.innerHTML = html;
  wireReplace(act);
}

function renderAcquisition(){
  const d = DATA.acquisition || {};
  const el = document.getElementById('acquisition');
  if (d.error) { el.innerHTML = `<div class="empty">${esc(d.error)}</div>`; return; }
  const s = d.summary || {};

  // free_inboxes is deliberately nullable: null means the send rows were
  // unreadable, and printing 0 there would read as "nothing spare" — a
  // confident answer we do not have.
  const freeKnown = s.free_inboxes != null;
  // "2 / 30" read as a denominator. 30 was 2 inboxes x 15 sends/day — a second
  // unit crammed into one card, which is worse than not showing it.
  const freeVal = freeKnown ? String(s.free_inboxes) : '?';

  // IN USE = on a live campaign: sending to new leads, sending follow-ups, or
  // between sequence steps. All three are working states. The old headline
  // divided sends/day by capacity/day, which counted a follow-up sequence's
  // deliberately spaced touches as waste and reported a 99%-deployed fleet as
  // 27% used.
  const used = s.in_use_pct;
  let html = '<div class="cards">'
    + card('In use', used != null ? used + '%' : '\u2013',
           used == null ? '' : used >= 90 ? 'ok' : used >= 70 ? 'warn' : 'bad')
    + card('Working', `${s.in_use ?? '\u2013'} <span class="dim" style="font-size:13px">of ${s.usable ?? '\u2013'}</span>`)
    + card('Free to reallocate', freeVal, freeKnown ? (s.free_inboxes ? 'ok' : 'warn') : 'warn')
    + card('Inboxes', s.inboxes ?? '\u2013')
    + card('Domains', s.domains ?? '\u2013')
    + card('Burned', s.burned ?? '\u2013', s.burned ? 'bad' : 'ok')
    + card('Replacement pool', s.replacement_pool != null ? s.replacement_pool : '?',
           s.replacement_pool === 0 ? 'bad' : '')
    + card('Over 3 / domain', s.over_cap_domains ?? '\u2013', s.over_cap_domains ? 'bad' : 'ok')
    + '</div>';

  // The full capacity, split by what each inbox is doing TODAY. Measured
  // against the last complete sending day, because an inbox that has not sent
  // yet this morning is not the same as one that sent nothing yesterday.
  const wk = d.work || {};
  if ((wk.states || []).length) {
    const mx = Math.max(1, ...wk.states.map(x => x.capacity));
    const tone = {new_leads: 'good', followups: 'good', between_sequences: 'warn',
                  no_work: 'bad', unallocated: 'bad', blocked: 'bad'};
    html += `<h2>What the capacity is doing${wk.day ? ` \u2014 ${esc(wk.day)}` : ''}</h2>
      <div class="wrap"><table>
        <tr><th>State</th><th>Inboxes</th><th>Capacity / day</th><th style="width:42%"></th></tr>
        ${wk.states.map(x => `<tr>
          <td class="${tone[x.state] === 'bad' ? 'dim' : ''}">${esc(x.label)}</td>
          <td class="n">${x.inboxes}</td>
          <td class="n">${x.capacity.toLocaleString()}</td>
          <td><span style="display:inline-block;height:9px;border-radius:2px;
            background:var(--${tone[x.state] === 'good' ? 'ok' : tone[x.state] === 'warn' ? 'warn' : 'dim2'});
            width:${Math.round(100 * x.capacity / mx)}%"></span></td></tr>`).join('')}
        <tr><td><b>Total</b></td><td class="n"><b>${wk.states.reduce((a, x) => a + x.inboxes, 0)}</b></td>
          <td class="n"><b>${(wk.total_capacity || 0).toLocaleString()}</b></td><td></td></tr>
      </table></div>
      <div class="meta" style="margin-top:8px">
        <b>Between sequence steps</b> is working capacity, not spare: those inboxes are
        mid-sequence with nothing due that day. Moving one cuts a live sequence.
        ${wk.measured === false
          ? '<br><b>Not measured today</b> \u2014 no send data, so follow-ups and the gap cannot be told apart.'
          : ''}</div>`;
  }

  html += `<div class="meta" style="margin:-8px 0 16px">Sending
    ${(s.actual_per_day ?? 0).toLocaleString()} a day across ${s.in_use ?? '?'} working inboxes.
    Daily volume is set by where each campaign is in its sequence, so it is not a
    utilisation figure \u2014 an inbox between sequence steps sends nothing today and is
    still working.</div>`;

  (d.notes || []).forEach(n => html += `<div class="banner">${esc(n)}</div>`);
  if (s.registrar_read === false)
    html += `<div class="banner">The registrar could not be read, so no domain here has a
      verified expiry. Nothing below is an all-clear.</div>`;

  html += '<h2>What the fleet is doing</h2><div class="wrap"><table>'
    + '<tr><th>State</th><th>Inboxes</th><th>Capacity / day</th></tr>'
    + (d.by_state || []).map(r => `<tr><td>${esc(r.state)}</td>
        <td class="n">${r.inboxes}</td><td class="n dim">${r.capacity}</td></tr>`).join('')
    + '</table></div>';

  html += `<h2>Free to point somewhere new \u2014 ${freeKnown ? (d.free || []).length : 'unknown'}</h2>`;
  if (!freeKnown) {
    html += '<div class="empty">No daily send rows, so this cannot be answered. '
          + 'Run the health sync.</div>';
  } else if (!(d.free || []).length) {
    html += '<div class="empty">Nothing is free. Every acquisition inbox is either sending, '
          + 'still working through follow-ups, or blocked.</div>';
  } else {
    html += `<div class="wrap"><table>
      <tr><th>Inbox</th><th>Group</th><th>Per day</th><th>Age</th><th>Why it is idle</th></tr>
      ${(d.free || []).map(i => `<tr><td>${esc(i.email)}</td><td class="dim">${esc(i.group || '')}</td>
        <td class="n">${i.per_day}</td><td class="n dim">${i.age_days != null ? i.age_days + 'd' : ''}</td>
        <td class="dim">${esc(i.why || i.state)}</td></tr>`).join('')}
    </table></div>
    <div class="meta" style="margin-top:10px">Measured over ${esc(s.window_from || '')}\u2013${esc(s.window_to || '')}
      (${s.window_sending_days ?? '?'} sending days): campaign state said idle AND the mailbox sent nothing.
      An inbox in the gap between sequence steps sends nothing today but did this week, so it is not here.</div>`;
  }

  if ((d.burned || []).length)
    html += `<h2 class="bad">Burned \u2014 ${d.burned.length}</h2>
      <div class="wrap"><table>
        <tr><th>Inbox</th><th>Group</th><th>Bounce 3d</th><th>Reply 3d</th><th>Per day</th></tr>
        ${d.burned.map(b => `<tr><td>${esc(b.email)}</td><td class="dim">${esc(b.group || '')}</td>
          <td class="n bad">${b.bounce_3d ?? ''}</td><td class="n dim">${b.reply_3d ?? ''}</td>
          <td class="n dim">${b.per_day ?? ''}</td></tr>`).join('')}
      </table></div>
      <div class="meta" style="margin-top:10px">Swap each from the Replacement Group
        ${s.replacement_pool != null ? `(${s.replacement_pool} available)` : '(size unknown)'}.
        Check for positive replies first \u2014 a replied-to thread stays welded to the inbox
        that sent it.</div>`;

  if ((d.lapsing || []).length)
    html += `<h2 class="bad">Lapsing with live senders \u2014 ${d.lapsing.length}</h2>
      <div class="wrap"><table>
        <tr><th>Domain</th><th>Expires</th><th>Days</th><th>Sending</th><th>Registrar</th></tr>
        ${d.lapsing.map(r => `<tr><td>${esc(r.domain)}</td><td>${esc(r.expires)}</td>
          <td class="n bad">${r.days_to_expiry}</td><td class="n">${r.sending}</td>
          <td class="dim">${esc(r.registrar || '')}</td></tr>`).join('')}
      </table></div>`;

  if ((d.over_cap || []).length)
    html += `<h2 class="bad">More than ${d.max_per_domain} inboxes on one domain \u2014 ${d.over_cap.length}</h2>
      <div class="wrap"><table>
        <tr><th>Domain</th><th>Inboxes</th><th>Sending</th></tr>
        ${d.over_cap.map(r => `<tr><td>${esc(r.domain)}</td><td class="n bad">${r.inboxes}</td>
          <td class="n">${r.sending}</td></tr>`).join('')}
      </table></div>
      <div class="meta" style="margin-top:10px">One bounce pattern takes out every mailbox on the domain,
        and the oldest one is an admin that cannot be removed while the others remain.</div>`;

  html += `<h2>Domains \u2014 ${(d.domains || []).length}</h2><div class="wrap"><table>
    <tr><th>Domain</th><th>Inboxes</th><th>Sending</th><th>Free</th><th>Expires</th><th>Auto-renew</th><th>Registrar</th></tr>
    ${(d.domains || []).map(r => {
      const ar = r.auto_renew == null ? '<span class="dim">unknown</span>'
               : r.auto_renew ? '<span class="good">on</span>' : '<span class="bad">off</span>';
      const exp = r.expires
        ? `${esc(r.expires)}${r.days_to_expiry != null ? ` <span class="dim">(${r.days_to_expiry}d)</span>` : ''}`
        : '<span class="dim">unknown</span>';
      return `<tr><td>${esc(r.domain)}${r.over_cap ? ' <span class="tag bad">over cap</span>' : ''}</td>
        <td class="n">${r.inboxes}</td><td class="n dim">${r.sending}</td>
        <td class="n">${r.free || ''}</td><td>${exp}</td><td>${ar}</td>
        <td class="dim">${esc(r.registrar || '')}</td></tr>`;
    }).join('')}
  </table></div>`;

  el.innerHTML = html;
}
