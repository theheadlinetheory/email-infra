// Which domains are actually still outstanding, by name. "Stuck" is usually
// "nine domains still owe mailboxes", and that is only actionable if you can
// see WHICH nine.
function pendingNote(o, j, at){
  const doms = o.domains || [];
  const jd = j.domains || {};
  const per = o.inboxes_per_domain || 3;
  const step = (j.step || '');
  let waiting = [], what = '';
  if (step === 'dns') {
    waiting = doms.filter(d => !(jd[d] || {}).dns_ready);
    what = 'waiting on DNS';
  } else if (step === 'mailboxes') {
    waiting = doms.filter(d => (jd[d] || {}).dns_ready && !(jd[d] || {}).mailboxes_done);
    what = 'still to get mailboxes';
  } else if (step === 'forwarding') {
    const done = new Set(j.forwarded || []);
    waiting = doms.filter(d => !done.has(d));
    what = 'still to be forwarded';
  }
  const errs = doms.filter(d => (jd[d] || {}).error)
                   .map(d => `${d}: ${(jd[d] || {}).error}`);
  let html = '';
  if (waiting.length) {
    html += `<div class="dim" style="margin-top:6px;font-size:11.5px">
      <b>${waiting.length} of ${doms.length}</b> ${esc(what)} —
      ${waiting.map(esc).join(', ')}</div>`;
  }
  if (errs.length) {
    html += `<div class="viol" style="margin-left:0">${errs.slice(0,6).map(esc).join('<br>')}
      <br><span class="dim">Zapmail rate-limits a long batch. These retry on the
      next pass — keep Provision running.</span></div>`;
  }
  if (step === 'done') {
    html += `<div class="good" style="margin-top:6px;font-size:11.5px">
      All ${doms.length * per} mailboxes are in SmartLead and warming. They are
      sendable 14 days after warm-up started.</div>`;
  }
  return html;
}

function renderOrders(){
  const d = document.getElementById('b-orders'); if (!d) return;
  if (!BUY.orders.length) { d.innerHTML = '<div class="empty">No orders yet.</div>'; return; }
  // Orders that never finished provisioning and are now months old are history,
  // not work in progress: their domains were registered and the batch was
  // completed by hand, so the order row just never advanced. Showing them as
  // live work invites someone to press Provision on a domain set that has been
  // in service since August.
  const STALE_DAYS = 30;
  const age = o => {
    const t = Date.parse(o.created || '');
    // An unparseable date must read as NEW, not old. Treating it as 0 days is
    // the safe direction: a visible order you can ignore beats a hidden one.
    return isNaN(t) ? 0 : Math.floor((Date.now() - t) / 86400000);
  };
  const live = BUY.orders.filter(o => !(o.status === 'domains_registered' && age(o) > STALE_DAYS));
  const stale = BUY.orders.filter(o => o.status === 'domains_registered' && age(o) > STALE_DAYS);
  if (!live.length) {
    d.innerHTML = `<div class="empty">No orders in progress.</div>`
      + (stale.length ? `<div class="meta" style="margin-top:8px">${stale.length} order(s) older than
           ${STALE_DAYS} days never advanced past “domains registered” —
           ${stale.map(o => esc(o.client_name || o.owner) + ' (' + age(o) + 'd)').join(', ')}.
           Their domains are live, so the order row is stale bookkeeping, not work to do.</div>` : '');
    return;
  }
  BUY.orders = live;
  // The pipeline, named, so an order in flight says WHERE it is rather than
  // showing a bare status nobody can act on.
  // These MUST match buy_provision.STEPS in order. `forwarding` was missing
  // here, so every step after it drew one place to the left — an order sending
  // to SmartLead rendered as "Creating mailboxes".
  const STEPS = [
    ['bought',     'Domains bought'],
    ['dns',        'DNS resolving'],
    ['slots',      'Mailbox slots bought'],
    ['mailboxes',  'Mailboxes created on Zapmail'],
    ['forwarding', 'Domain forwarding set'],
    ['export',     'Handed to SmartLead'],
    ['find',       'Confirmed in SmartLead'],
    ['tag',        'Tagged'],
    ['warmup',     'Warm-up started'],
    ['done',       'Live — warming for 14 days'],
  ];

  // What each step has actually achieved, so a stalled order says 15/42 rather
  // than showing a dot and leaving you to guess.
  function progressOf(o, j, key){
    const doms = o.domains || [];
    const per  = o.inboxes_per_domain || 3;
    const jd   = j.domains || {};
    const n    = k => doms.filter(d => (jd[d] || {})[k]).length;
    const mailboxes = doms.reduce(
      (t, d) => t + (((jd[d] || {}).mailboxes || []).length), 0);
    switch (key) {
      case 'bought':     return {have: doms.length, want: doms.length, unit: 'domains'};
      case 'dns':        return {have: n('dns_ready'), want: doms.length, unit: 'domains'};
      case 'slots':      return {have: null, want: null,
                                 note: j.slots_needed ? `${j.slots_needed} still to cover` : ''};
      case 'mailboxes':  return {have: mailboxes, want: doms.length * per, unit: 'mailboxes'};
      case 'forwarding': return {have: (j.forwarded || []).length, want: doms.length, unit: 'domains'};
      case 'export':
      case 'find':       return {have: Object.keys(j.smartlead || {}).length,
                                 want: doms.length * per, unit: 'mailboxes'};
      case 'tag':        return {have: (j.tagged || []).length, want: doms.length * per, unit: 'mailboxes'};
      case 'warmup':     return {have: (j.warmed || []).length, want: doms.length * per, unit: 'mailboxes'};
      default:           return {have: null, want: null};
    }
  }
  d.innerHTML = BUY.orders.map(o => {
    const j = o.journal || {};
    const step = j.step || (o.status === 'live' ? 'done' : 'bought');
    const at = Math.max(0, STEPS.findIndex(x => x[0] === step));
    const r = o.readiness || {};
    const nd = (o.domains || []).length;
    const ready = r.ready_count != null ? `${r.ready_count}/${nd} DNS ready` : '';
    // A labelled checklist, not a row of dots. "When does warm-up start" and
    // "when do these reach SmartLead" are answerable by reading down it.
    const track = '<div class="steps">' + STEPS.map(([k, label], i) => {
      const done = i < at, now = i === at;
      const cls  = done ? 'good' : now ? 'warn' : 'dim';
      const mark = done ? '✓' : now ? '●' : '○';
      const p    = progressOf(o, j, k);
      let count  = '';
      if (p.have != null && p.want) {
        const short = p.have < p.want;
        count = `<span class="${short && (done || now) ? 'warn' : 'dim'}">`
              + `${p.have} / ${p.want} ${esc(p.unit || '')}</span>`;
      } else if (p.note) {
        count = `<span class="dim">${esc(p.note)}</span>`;
      }
      return `<div class="steprow">
        <span class="${cls}" style="width:1.2em;display:inline-block">${mark}</span>
        <span class="${now ? '' : cls}">${esc(label)}</span>
        <span style="flex:1"></span>${count}
      </div>`;
    }).join('') + '</div>';
    return `<div class="c" style="margin-bottom:10px">
      <div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">
        <b>Order ${o.id}</b>
        <span class="tag">${esc(o.client_name || o.owner || 'unassigned')}</span>
        <span class="tag">${esc(o.provider || 'GOOGLE')}</span>
        <span class="dim">${nd} domains · ${(o.connected || []).length} connected to Zapmail
          ${ready ? '· ' + ready : ''}</span>
        <span style="flex:1"></span>
        <span class="dim" style="font-size:11px">${esc(String(o.created || '').slice(0, 10))}</span>
        ${step === 'done' ? '<span class="chip ok">live</span>' :
          `<button class="act" data-prov="${o.id}">Provision now</button>`}
      </div>
      <div style="margin-top:7px;font-size:12px">${track}</div>
      ${pendingNote(o, j, at)}
      ${(o.failed || []).length
        ? `<div class="viol" style="margin-left:0">${o.failed.length} domain(s) failed to register:
             ${o.failed.slice(0, 4).map(f => esc(f.domain || f)).join(', ')}</div>` : ''}
      <div class="dim" style="margin-top:6px;font-size:11.5px">${(o.domains || []).join(', ')}</div>
      ${j.blocked_reason ? `<div class="viol" style="margin-left:0">${esc(j.blocked_reason)}</div>` : ''}
      ${(j.log || []).length ? `<div class="dim" style="margin-top:6px;font-size:11px">${
        (j.log || []).slice(-6).map(l => esc(l)).join('<br>')}</div>` : ''}
    </div>`;
  }).join('');
  d.querySelectorAll('button[data-prov]').forEach(b => b.onclick = () => doProvision(b.dataset.prov, b));
}

function wireBuy(){
  // Acquisition buys OUR brand, so the vertical picker is meaningless there —
  // it was offering generic service names for a THT prospecting batch.
  const ownerChanged = () => {
    const client = document.getElementById('b-owner').value === 'client';
    document.getElementById('b-client').style.display = client ? '' : 'none';
    document.getElementById('b-theme').style.display = client ? '' : 'none';
    document.getElementById('b-brandnote').style.display = client ? 'none' : '';
  };
  document.getElementById('b-owner').onchange = ownerChanged;
  ownerChanged();
  document.getElementById('b-suggest').onclick = async (e) => {
    e.target.disabled = true; e.target.textContent = 'checking…';
    const owner = document.getElementById('b-owner').value;
    const body = {count: +document.getElementById('b-count').value || 12,
                  tld: document.getElementById('b-tld').value, owner};
    const cn = (document.getElementById('b-client').value || '').trim();
    if (owner === 'client') {
      body.theme = document.getElementById('b-theme').value || undefined;
      if (cn) body.brand = cn;
    }
    // owner === 'acquisition' sends no brand: the API fills in ours, so a
    // hand-made request gets the same answer as the page.
    const r = await post('/api/buy-suggest', body);
    e.target.disabled = false; e.target.textContent = 'Suggest';
    BUY.suggest = r.suggestions || [];
    if (r.error) BUY.plan = {error: r.error};
    renderSuggestions(); renderPlan();
  };
  document.getElementById('b-add').onclick = () => {
    const v = (document.getElementById('b-manual').value || '').trim().toLowerCase();
    if (!v) return;
    if (!BUY.suggest.some(x => x.domain === v)) BUY.suggest.unshift({domain: v, price: 0});
    BUY.chosen.add(v);
    document.getElementById('b-manual').value = '';
    renderSuggestions();
  };
}

function buySpec(){
  const owner = document.getElementById('b-owner').value;
  return {owner, client_name: owner === 'client'
            ? (document.getElementById('b-client').value || '').trim() : null,
          provider: 'google', inboxes_per_domain: 3,
          domains: [...BUY.chosen]};
}

async function doPlan(){
  if (!BUY.chosen.size) return;
  BUY.plan = {error: 'checking availability…'}; renderPlan();
  BUY.plan = await post('/api/buy-plan', buySpec());
  renderPlan();
}

async function doBuy(){
  const p = BUY.plan || {}, c = p.cost || {}, n = p.counts || {};
  const fwd = (document.getElementById('b-fwd').value || '').trim();
  if (!fwd && !confirm('No forwarding target set.\n\nThe domains will be bought, but '
                     + 'provisioning will stop before they go live until you give one — '
                     + 'a domain that prospects nowhere is worse than no domain.\n\n'
                     + 'Continue anyway?')) return;
  if (!confirm(`Register ${n.available} domain(s) for ${money(c.domains_onetime)}?\n\n`
             + `This spends money now. Mailboxes (${money(c.mailboxes_monthly)}/mo) are `
             + `bought later, when you press Provision.`)) return;
  const b = document.getElementById('b-buy');
  b.disabled = true; b.textContent = 'registering…';
  // Poll while it runs. A purchase is a minute or more of irreversible,
  // paid registrations, and a page that shows nothing invites a second click.
  let polling = true;
  const tick = async () => {
    while (polling) {
      const pr = await get('/api/buy-progress');
      if (pr && pr.running) {
        rpBuyNote(`<b>${pr.done ?? 0} of ${pr.total ?? '?'}</b> registered`
          + (pr.stage ? ` — ${esc(pr.stage)}` : '')
          + (pr.connected != null ? ` · ${pr.connected} connected to Zapmail` : '')
          + '<br><span class="dim">Do not press Register again — domains are not refundable.</span>');
      }
      await new Promise(r => setTimeout(r, 2000));
    }
  };
  tick();
  const r = await post('/api/buy-domains', {...buySpec(), forward_to: fwd, confirm: true});
  polling = false;
  if (r.error) {
    rpBuyNote(`<span class="bad">${esc(r.error)}</span>`);
    b.disabled = false; b.textContent = 'Register'; return;
  }
  const bits = [`Registered ${(r.registered || []).length}`,
                `${(r.connected || []).length} connected to Zapmail`];
  if ((r.connect_pending || []).length) bits.push(`${r.connect_pending.length} awaiting DNS`);
  if ((r.failed || []).length) bits.push(`${r.failed.length} FAILED`);
  rpBuyNote(`<span class="good">${bits.join(' · ')}</span><br>
    <span class="dim">${esc(r.note || '')}</span>`);
  BUY.chosen.clear(); BUY.plan = null;
  await loadOrders(); renderBuy();
}

function rpBuyNote(html){
  const el = document.getElementById('b-progress');
  if (el) el.innerHTML = html;
}

// Provisioning answers `resume: true` while DNS propagates or an export
// settles. That is the normal state for the first hour, so the button keeps
// asking on a timer rather than making someone click twenty times — and stops
// the moment the order is done or genuinely blocked.
async function doProvision(id, btn){
  if (BUY.busy) return;
  BUY.busy = true;
  const dry = await post('/api/buy-provision', {order_id: +id});
  if (dry.error) { alert(dry.error); BUY.busy = false; return; }
  if (!confirm(`Provision order ${id}?\n\n${dry.ready_count ?? 0} of `
             + `${(dry.domains || []).length} domains have DNS ready. This buys mailbox `
             + `slots ($3/mailbox/month) and starts 14 days of warm-up.`)) { BUY.busy = false; return; }
  let tries = 0;
  const tick = async () => {
    btn.textContent = `working… (${++tries})`;
    const r = await post('/api/buy-provision', {order_id: +id, confirm: true});
    await loadOrders(); renderOrders();
    // The server keeps going after we stop listening — mailbox creation on 14
    // domains outruns the browser's 120s long before it outruns Vercel's 300s.
    // Treating that as an error stopped the poll AND told the user it had
    // failed, while slots were being bought behind the alert.
    if (r.timedOut) { btn.textContent = 'still working…'; setTimeout(tick, 15000); return; }
    if (r.error) { alert(r.error); BUY.busy = false; return; }
    if (r.done) { BUY.busy = false; return; }
    if (!r.resume) { BUY.busy = false; return; }   // blocked; the reason is on the order
    setTimeout(tick, 30000);
  };
  tick();
}

async function loadOrders(){
  const r = await get('/api/buy-orders');
  BUY.orders = r.orders || [];
}

// ── the burned-inbox replacement loop ──────────────────────────────────
// Every one of these endpoints already existed and already worked — this is
// the old health tab's flow, wired to the new table. Nothing new is invented
// and no step is skipped.
function rpSelected(){
  return [...document.querySelectorAll('input.rp:checked')].map(c => c.dataset.e);
}
function rpNote(html){ document.getElementById('rp-out').innerHTML = html; }

function wireDomainCards(){
  const dmsg = (dom, html) => {
    const el = document.getElementById('dm-' + dom.replace(/[^a-z0-9]/gi, '-'));
    if (el) el.innerHTML = html;
  };
  document.querySelectorAll('button[data-dreal]').forEach(b => b.onclick = async () => {
    const dom = b.dataset.dreal;
    const row = ((DATA.inboxes || {}).domain_view || {}).domains.find(x => x.domain === dom);
    const emails = (row.need_reallocate || []).map(m => m.email);
    dmsg(dom, 'checking reserve…');
    // Positive-reply pre-flight first, same order as every other path here:
    // a reply is welded to the mailbox that sent it.
    const pre = await post('/api/health-positive-check', {emails});
    const held = (pre.results || []).filter(r => (r.positive_total ?? 0) > 0).length;
    if (!confirm(`Reallocate ${emails.length} burned inbox(es) on ${dom}?\n\n`
               + (held ? `${held} own a positive reply and will be HELD in their campaign — `
                       + `the replacement still goes in.\n\n` : '')
               + `Each is swapped for a niche-matched reserve inbox.`)) { dmsg(dom, ''); return; }
    dmsg(dom, 'reallocating…');
    const r = await post('/api/health-reallocate', {emails, confirm: true});
    dmsg(dom, r.error ? `<span class="bad">${esc(r.error)}</span>`
                      : `<span class="good">done — now hit Reallocate mailboxes in SmartLead</span>`);
    showTab('inboxes', true);
  });
  document.querySelectorAll('button[data-dcancel]').forEach(b => b.onclick = async () => {
    const dom = b.dataset.dcancel;
    const row = ((DATA.inboxes || {}).domain_view || {}).domains.find(x => x.domain === dom);
    const warn = row && !row.clean_cancel
      ? `\n\nWARNING: this domain still carries inboxes that are NOT burned. Cancelling `
        + `removes every mailbox on it.`
      : '';
    if (!confirm(`Schedule Zapmail removal for ${dom}?\n\n`
               + `Every mailbox on the domain goes on its next billing date.${warn}`)) return;
    dmsg(dom, 'registering…');
    const r = await post('/api/zapmail-removals',
                         {action: 'register', domains: [dom], source: 'dashboard-domain'});
    dmsg(dom, r.error ? `<span class="bad">${esc(r.error)}</span>`
                      : '<span class="good">scheduled — #zapmail-billing will confirm</span>');
    showTab('inboxes', true);
  });
  document.querySelectorAll('button[data-realdone]').forEach(b => b.onclick = async () => {
    await post('/api/health-reallocate-campaigns', {done: b.dataset.realdone});
    showTab('inboxes', true);
  });
}

function wireReplace(act){
  // The burned-DOMAIN cards are wired unconditionally. They used to live below
  // the `if (!sel) return` guard, so whenever "Burned on a live client" was
  // empty there was no #rp-sel, this function bailed, and every "Cancel domain"
  // and "Reallocate" button on the page was left dead — a button that looks
  // live and does nothing.
  wireDomainCards();
  const sel = document.getElementById('rp-sel');
  const flag = document.getElementById('rp-flag');
  const canc = document.getElementById('rp-cancel');
  const realloc = document.getElementById('rp-realloc');
  if (!sel) return;
  const sync = () => {
    const n = rpSelected().length;
    sel.textContent = n + ' selected';
    // Flagging stays locked until positives have been checked for THIS
    // selection. The old flow's safety was the order, not the buttons.
    flag.disabled = !(n && RP_CHECKED);
    if (realloc) realloc.disabled = !(n && RP_CHECKED);
    canc.disabled = !n;
  };
  document.querySelectorAll('input.rp').forEach(c => c.onchange = () => { RP_CHECKED = false; sync(); });
  document.getElementById('rp-all').onclick = () => {
    const on = rpSelected().length !== act.length;
    document.querySelectorAll('input.rp').forEach(c => { c.checked = on; });
    RP_CHECKED = false; sync();
  };

  document.getElementById('rp-check').onclick = async () => {
    const emails = rpSelected();
    if (!emails.length) return rpNote('<div class="banner">Select at least one inbox.</div>');
    rpNote('<div class="meta">checking replies…</div>');
    const r = await post('/api/health-positive-check', {emails});
    if (r.error) return rpNote(`<div class="banner">${esc(r.error)}</div>`);
    let held = 0;
    (r.results || []).forEach(x => {
      const cell = document.getElementById('pos-' + x.email);
      const n = x.positive_total ?? 0;
      if (n) held++;
      if (cell) cell.innerHTML = n ? `<span class="bad">${n}</span>` : '<span class="good">0</span>';
    });
    RP_CHECKED = true; sync();
    rpNote(`<div class="banner">${held ? held + ' of ' + emails.length +
      ' own a positive reply and will be HELD in their campaign — the replacement still goes in, '
      + 'so capacity comes back. The rest can be swapped out.'
      : 'None own a positive reply. All ' + emails.length + ' can be swapped out.'}</div>`);
  };

  document.getElementById('rp-realloc').onclick = async () => {
    const emails = rpSelected();
    rpNote('<div class="meta">checking reserve…</div>');
    // Dry run first — it reports whether there is matching reserve for each
    // niche before anything moves.
    const dry = await post('/api/health-reallocate', {emails});
    if (dry.error) return rpNote(`<div class="banner">${esc(dry.error)}</div>`);
    const n = dry.reallocatable ?? emails.length;
    if (!confirm(`Reallocate ${n} inbox(es)?\n\n`
               + `Each is removed from its ACTIVE campaign and a niche-matched reserve `
               + `inbox goes in. After this you must hit Reallocate mailboxes on the `
               + `campaign in SmartLead — the checklist below will show which.`)) return;
    rpNote('<div class="meta">reallocating…</div>');
    const r = await post('/api/health-reallocate', {emails, confirm: true});
    rpNote(r.error ? `<div class="banner">${esc(r.error)}</div>`
                   : `<div class="banner">Reallocated ${r.reallocated ?? n}. Now hit
                      <b>Reallocate mailboxes</b> on the campaigns listed below.</div>`);
    showTab('inboxes', true);
  };

  document.getElementById('rp-flag').onclick = async () => {
    const emails = rpSelected();
    if (!confirm(`Flag ${emails.length} inbox(es) for replacement?\n\n`
               + `This pulls niche-matched inboxes out of the reserve.`)) return;
    rpNote('<div class="meta">flagging…</div>');
    const r = await post('/api/health-replace', {emails});
    if (r.error) return rpNote(`<div class="banner">${esc(r.error)}</div>`);
    rpNote(`<div class="banner">${(r.created ?? (r.jobs || []).length)} replacement job(s) open.
      Reserve left: ${esc(JSON.stringify(r.reserve || {}))}</div>`);
    showTab('inboxes', true);
  };

  document.getElementById('rp-cancel').onclick = async () => {
    const emails = rpSelected();
    const domains = [...new Set(emails.map(e => e.split('@')[1]))];
    if (!confirm(`Schedule Zapmail removal for ${domains.length} domain(s)?\n\n`
               + `${domains.join(', ')}\n\nRemoval happens on the next billing date, so no `
               + `days are wasted — but every mailbox on these domains goes, not just the burned one.`)) return;
    rpNote('<div class="meta">registering…</div>');
    const r = await post('/api/zapmail-removals', {action: 'register', domains, source: 'dashboard'});
    rpNote(r.error ? `<div class="banner">${esc(r.error)}</div>`
                   : `<div class="banner">Registered ${domains.length} domain(s) with the
                      #zapmail-billing watcher. It will confirm on the deletion date.</div>`);
  };

  document.querySelectorAll('button[data-keep]').forEach(b => b.onclick = async () => {
    await post('/api/health-positive-release', {key: b.dataset.keep, action: 'keep'});
    showTab('inboxes', true);
  });
  document.querySelectorAll('button[data-rel]').forEach(b => b.onclick = async () => {
    if (!confirm('Detach this inbox from the campaign? Do this only after the reply has been worked.')) return;
    await post('/api/health-positive-release', {key: b.dataset.rel, confirm: true});
    showTab('inboxes', true);
  });

  document.querySelectorAll('button[data-adv]').forEach(b => b.onclick = async () => {
    if (!confirm('Swap the replacement in?')) return;
    await post('/api/health-replace/advance', {id: +b.dataset.adv, action: b.dataset.act, confirm: true});
    showTab('inboxes', true);
  });
  sync();
}
let RP_CHECKED = false;

function renderPools(){
  const d = DATA.clients || {};
  const el = document.getElementById('pools');
  if (d.error) { el.innerHTML = `<div class="empty">${esc(d.error)}</div>`; return; }
  const rows = (d.pools || []).map(p => `<tr><td>${esc(p.name)}</td>
    <td class="n">${p.inboxes}</td><td class="n dim">${money(p.monthly_cost)}</td></tr>`).join('');
  // The numbers sat miles from their heading because the table stretched to the
  // full page width for three columns. Constrain it and let the name column
  // absorb the slack.
  el.innerHTML = `<h2>Pools — inboxes with no client attached</h2>
    <div class="wrap"><table style="max-width:560px">
      <tr><th style="width:60%">Pool</th><th style="width:20%">Inboxes</th>
          <th style="width:20%">$/mo</th></tr>${rows}</table></div>
    <div class="meta" style="margin-top:10px">Stock that can still be given to a client.
      Reserve is Generic Landscaping 1 + 2 (84 = two clients' worth); Replacement Group is separate,
      for swapping burned inboxes. Acquisition is not listed here \u2014 it is our own prospecting
      fleet, already deployed, and it has its own tab.</div>`;
}

function banners(){
  const inv = DATA.invariants || {}, cl = DATA.clients || {};
  let h = '';
  if (LOAD_ERRORS.length)
    h += `<div class="banner">${LOAD_ERRORS.length} feed(s) did not load:
      ${LOAD_ERRORS.map(esc).join(' · ')}. Anything below is incomplete.</div>`;
  if (inv.stale) h += `<div class="banner">Rule results are ${ago(inv.age_seconds)} — the daily cron may not have run.</div>`;
  if (cl._stale) h += `<div class="banner">Client data is ${ago(cl._age_seconds)} and was rebuilt on request.</div>`;
  if (inv.active_campaigns === 0) h += `<div class="banner">0 ACTIVE campaigns. Anything keyed on campaign membership was skipped, not passed.</div>`;
  (inv.sources_unavailable || []).forEach(s => h += `<div class="banner">Source unavailable: ${esc(s)} — rules needing it were skipped.</div>`);
  document.getElementById('banners').innerHTML = h;
}

// Every tab used to be fetched before anything rendered, so opening the
// dashboard waited on the SLOWEST of five endpoints — several of which rebuild
// a whole Zapmail or Smartlead walk on a cache miss. Nobody needs the
// acquisition fleet to read the Overview.
//
// Now: Overview's two feeds load first and the page paints. Every other tab
// fetches the first time it is opened and is remembered after that. Reload
// re-fetches whatever is already on screen.
const FEEDS = {
  invariants:  '/api/invariants',
  clients:     '/api/clients',
  inboxes:     '/api/inboxes',
  acquisition: '/api/acquisition',
  onboarding:  '/api/onboarding',
};
const RENDER = {
  overview: renderOverview, clients: renderClients, onboarding: renderOnboarding,
  inboxes: renderInboxes, acquisition: renderAcquisition, pools: renderPools,
};
// Which feeds a tab needs before it can draw.
const TAB_FEEDS = {
  overview: ['invariants', 'clients'],
  clients: ['clients'], onboarding: ['onboarding'], inboxes: ['inboxes'],
  acquisition: ['acquisition'], pools: ['clients'], buy: [],
};
const LOADED = {};

async function need(keys, force){
  const want = keys.filter(k => force || !(k in LOADED));
  if (!want.length) return;
  const got = await Promise.all(want.map(k => get(FEEDS[k])));
  want.forEach((k, i) => { DATA[k] = got[i]; LOADED[k] = true; });
  // One failed feed must not be mistaken for an empty one: each renderer shows
  // its own error, and the header says the load was not clean.
  const bad = want.filter((k, i) => got[i] && got[i].error);
  if (bad.length) LOAD_ERRORS = bad.map(k => `${k}: ${DATA[k].error}`);
  else LOAD_ERRORS = [];
}
let LOAD_ERRORS = [];

function stamp(){
  const bits = [];
  const cl = DATA.clients, inv = DATA.invariants;
  if (cl && !cl.error) bits.push('clients ' + ago(cl._age_seconds));
  if (inv && !inv.error) bits.push('rules ' + ago(inv.age_seconds));
  document.getElementById('meta').textContent = bits.join(' · ') || 'no data';
}

let CURRENT = 'overview';

async function showTab(t, force){
  CURRENT = t;
  const el = document.getElementById(t);
  const pending = (TAB_FEEDS[t] || []).some(k => force || !(k in LOADED));
  if (pending && RENDER[t]) el.innerHTML = '<div class="empty">loading…</div>';
  try {
    await need(TAB_FEEDS[t] || [], force);
    stamp(); banners();
    if (RENDER[t]) RENDER[t]();
    if (t === 'buy') { await loadOrders(); renderBuy(); }
  } catch (e) {
    // A throw here used to leave the tab showing "loading…" for ever. Whatever
    // went wrong, say so on the page — a stuck spinner is the one outcome that
    // tells you nothing.
    el.innerHTML = `<div class="banner">This tab failed to load:
      ${esc(e && e.message ? e.message : String(e))}<br>
      <span class="dim">Press Reload, or open another tab and come back.</span></div>`;
    document.getElementById('meta').textContent = 'load failed';
  }
}

async function load(){
  document.getElementById('meta').textContent = 'loading…';
  await showTab(CURRENT, true);
  // Overview quotes one number off the other tabs. Fetch them after the page
  // has painted, then repaint the cards — never before the first render.
  if (CURRENT === 'overview') {
    need(['inboxes', 'acquisition', 'onboarding']).then(() => {
      if (CURRENT === 'overview') renderOverview();
    });
  }
}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  ['overview','clients','onboarding','inboxes','acquisition','buy','pools'].forEach(t =>
    document.getElementById(t).hidden = (t !== b.dataset.t));
  showTab(b.dataset.t);
});
document.getElementById('reload').onclick = () => showTab(CURRENT, true);
load();
</script>
